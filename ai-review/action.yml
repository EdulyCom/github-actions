name: ai-review
description: >
  Runs the CI-native AI review gate against a pull request: authors a
  native GitHub PR review (APPROVE / REQUEST_CHANGES) and a pass/fail
  label, then exposes the verdict as a job output
  (`verdict`/`confidence`/`merge_risk`/`review_event`) a consumer's own CI
  reads to gate its heavier build/test/deploy lanes. See
  docs/adr/0001-ci-native-ai-review-gate.md for why the gate is an ordinary
  job output rather than an identity-pinned Check Run, and why the review
  identity is cosmetic. The verdict is produced by a real two-stage AI
  review pipeline: a Haiku context stage summarizes the diff, then a
  diff-size-routed Sonnet/Opus review stage performs the full rubric scan
  and returns a schema-validated result that a deterministic step
  recomputes the pass/fail decision from.

inputs:
  app-id:
    description: >
      GitHub App ID. Optional — when supplied together with `private-key`,
      the review and labels are authored under that App's own slug
      (`<app-slug>[bot]`) instead of `github-actions[bot]`. Purely a
      cosmetic identity choice; never a gate input. See ADR 0001 (b).
    required: false
  private-key:
    description: >
      GitHub App private key, paired with `app-id`. A token is minted for
      this job only, scoped to `pull-requests: write`, `issues: write`, and
      `checks: read` (never the installation's full permission set).
    required: false
  github-token:
    description: >
      Fallback token used to call the GitHub REST API when `app-id` /
      `private-key` are not set. Defaults to the calling workflow's own
      GITHUB_TOKEN; override only if the caller needs a different identity
      or scope. Also used directly (regardless of whether `app-id` /
      `private-key` are set) by the read-only Context stage, which never
      needs the App-minted write-scoped identity.
    required: false
    default: ${{ github.token }}
  allowed-bots:
    description: >
      Comma-separated list of bot actor usernames allowed to trigger the
      Context/Review stages, or '*' to allow all bots. Passed straight
      through to the underlying `claude-code-action`'s own `allowed_bots`
      input on all three stage invocations (Context, Review, Review
      retry). Empty (default) allows no bots — every stage rejects a
      Bot-type actor (e.g. `dependabot[bot]`) with "Workflow initiated by
      non-human actor", so the Context stage never writes context.md and
      the Review stage never emits structured output; the gate then
      publishes an inconclusive/fail verdict instead of a real review, on
      every PR from that bot. Set explicitly (e.g. `dependabot[bot]`) to
      let a trusted dependency-bump bot through the gate. WARNING: on a
      public repo, `'*'` lets any App invoke the review with prompts it
      controls — scope this to named bots, not `'*'`.
    required: false
    default: ""
  pr-number:
    description: >
      Pull request number to review. Optional — defaults to the
      triggering event's `pull_request.number`. Required when the caller
      workflow is invoked via `workflow_dispatch` (e.g. a maintainer
      manually reviewing a fork PR).
    required: false
  pass-label:
    description: Label applied to the PR when the review verdict is a pass.
    required: false
    default: "✓ /ai-review"
  fail-label:
    description: Label applied to the PR when the review verdict is a fail.
    required: false
    default: "✗ /ai-review"
  qa-pass-label:
    description: >
      Post-merge `ai-qa` pass label. This action clears it (does not
      apply it) on every new commit so a stale QA badge from a prior
      commit doesn't linger on the PR.
    required: false
    default: "✓ /ai-qa"
  qa-fail-label:
    description: >
      Post-merge `ai-qa` fail label. This action clears it (does not
      apply it) on every new commit, for the same reason as
      `qa-pass-label`.
    required: false
    default: "✗ /ai-qa"
  confidence-threshold:
    description: >
      Minimum blocking-finding confidence (0-100) required for a pass
      verdict. Consumed by the deterministic Publish review step, which
      recomputes confidence from the review stage's reported P0/P1 counts
      and test-quality signals and compares it against this threshold.
      P2/P3 findings are advisory: they lower the reported confidence (and
      so the merge-risk band) but never block the gate. See
      docs/adr/0004-non-blocking-findings-and-structured-output-repair.md.
    required: false
    default: "90"
  sonnet-model:
    description: >
      Model ID used by the diff-size routing step ONLY for tiny diffs
      (≤`sonnet-files-threshold` files AND ≤`sonnet-churn-threshold`
      changed lines). Every larger diff routes to `opus-model`. Consumed
      by the routing step, whose output feeds the Review stage as the
      model to run. Override when a gateway aliases model names.
    required: false
    default: "claude-sonnet-5"
  opus-model:
    description: >
      Model ID used by the diff-size routing step for all non-tiny diffs
      (the default — the review stage prefers Opus, dropping to
      `sonnet-model` only for trivially small changes). Consumed by the
      routing step, whose output feeds the Review stage as the model to
      run. Override when a gateway aliases model names.
    required: false
    default: "claude-opus-5"
  sonnet-files-threshold:
    description: >
      Max changed-file count for a diff to still be considered "tiny" and
      routed to `sonnet-model`. A diff qualifies for Sonnet only when it
      is at or under BOTH this and `sonnet-churn-threshold`; anything
      larger routes to `opus-model`. Widened to 25 (from 15) — measured over
      682 review jobs, 89% of all traffic routed to Opus, and Opus runs cost
      3x the wall-clock (28.1 min median vs 9.2) and 4x the spend ($13.22 vs
      $3.27) of Sonnet ones. This is NOT a depth concession: the parallel
      design puts every coverage reviewer on Sonnet under the approved OSH
      tiering, so widening early previews that end state. Both thresholds go
      away entirely once the review stage fans out.
    required: false
    default: "25"
  sonnet-churn-threshold:
    description: >
      Max changed-line count (additions + deletions) for a diff to still
      be considered "tiny" and routed to `sonnet-model`. Applied together
      with `sonnet-files-threshold` (both must hold for Sonnet). Widened to
      800 alongside `sonnet-files-threshold` — see the note there.
    required: false
    default: "800"
  haiku-model:
    description: >
      Model ID used by the context stage (this phase) to read the diff and changed
      files and write context.md for the review stage to consume. Override when a
      gateway aliases model names. NOTE: Haiku 4.5 does not accept the `effort`
      parameter, so no stage running this model may pass `--effort`.
    required: false
    default: "claude-haiku-4-5"
  enable-context-stage:
    description: >
      When 'true' (default) the Haiku context stage runs and writes
      `context.md` for the review stage to read "if present". Set to 'false'
      to skip it entirely.

      Escape hatch, added after a measured stall: on run 31317613715 this
      stage sat silent for 27m27s between "Claude Code initialized" and its
      result, returned `num_turns: 1` with zero tool calls, wrote no
      `context.md` at all, and consumed 100% of the job's model time before
      the caller's timeout killed the run. Two earlier 85-min jobs showed the
      same shape with `duration_ms` within 1.2% of this one, which points at
      a fixed retry/timeout ceiling rather than ordinary slowness.
      `--fallback-model` does not rescue it.

      The stage is already best-effort (`continue-on-error`) and its output is
      already optional, so disabling it removes a wall-clock risk without
      changing the gate's contract. Defaults to 'true' so no consumer
      behaviour changes on upgrade.
    required: false
    default: "true"
  api-timeout-ms:
    description: >-
      Per-request timeout in milliseconds for every Claude stage, passed to
      the CLI as `API_TIMEOUT_MS`.

      DOES NOT BOUND THE ~27.5-MINUTE STALL. This input was introduced on the
      theory that the stall was the CLI default (600000, 10 min) multiplied by
      the SDK's timeout retries — `timeout x (max_retries + 1)` ~= 30 min.
      Run 31356469199 falsified that: with this input set to 180000 the
      context stage still hung for 1656307 ms (27m36s) on a single turn,
      landing in the same tight cluster as the three stalls observed before it
      (1647262, 1666947 x2 — a 1.2% spread). A 3-minute per-request timeout
      producing a 27.6-minute stall means the ceiling is enforced somewhere
      this setting does not reach.

      What it is still good for: a genuine per-request bound. No run has shown
      it clipping legitimate work (observed turn latency is 4-9s, so 180000
      leaves >20x headroom), and it fails a wedged request faster than the
      10-minute default would. Raise it if a legitimate single turn is ever
      cut off. Do not rely on it to bound a stall.
    required: false
    default: "180000"
  anthropic-api-key:
    description: >
      Anthropic API key, sent as the `x-api-key` header. Mutually exclusive with
      `anthropic-auth-token` — supply exactly one. Required for both the Context stage
      and the Review stage (Sonnet/Opus) to call the Anthropic API.
    required: false
  anthropic-auth-token:
    description: >
      Anthropic bearer token (`Authorization: Bearer …`), for gateways that
      authenticate this way instead of an API key. Mutually exclusive with
      `anthropic-api-key` — supply exactly one. Internally, this value is also passed
      as a fallback `anthropic_api_key` to the context stage due to an upstream
      validation gap (anthropics/claude-code-action#1294).
    required: false
  anthropic-base-url:
    description: >
      Optional override for the Anthropic API base URL (e.g. a caller's custom
      gateway). When omitted, the standard Anthropic endpoint is used.
    required: false
  test-command:
    description: >
      DEPRECATED — accepted but ignored; the Review stage no longer runs
      tests. It never successfully did: no consumer ever set this input, no
      caller installs a toolchain before the action, and every sampled run
      reported `test_execution: skipped`. Meanwhile the allowlist needed to
      support it granted the review session shell access to npm/npx/yarn/
      pnpm/node/make/pytest while checked out at the PR head commit — a
      code-execution path from PR content onto the runner, for a capability
      that never worked. Tests run in the caller's own CI lanes downstream
      of this gate. Still accepted so existing callers do not break; will be
      deleted in a future release. See ai-review/README.md.
    required: false
  test-hint:
    description: >
      DEPRECATED — accepted but ignored, for the same reason as
      `test-command`. See that input's description.
    required: false
  update-pr-body:
    description: >
      When 'true' (default), the Publish step ticks verified checklist
      boxes (`- [ ]` → `- [x]`) in the PR description in place and
      maintains a managed `<!-- ai-review-status -->` block with per-item
      verification evidence. It never unchecks a human-checked box. Set to
      'false' to leave the PR body untouched.
    required: false
    default: "true"
  update-linked-issues:
    description: >
      Reserved for parity with `ai-qa`. When 'true' (default), the Review
      stage resolves issues the PR closes (closing keywords + GitHub's
      linked-issue graph) and evaluates the diff against their acceptance
      criteria. ai-review only READS linked issues; it never mutates issue
      state (that is ai-qa's post-merge job).
    required: false
    default: "true"

outputs:
  verdict:
    description: "'pass' or 'fail'. Empty when the review was skipped (fork PR, draft, or closed)."
    value: ${{ steps.publish.outputs.verdict }}
  confidence:
    description: "Confidence score, 0-100."
    value: ${{ steps.publish.outputs.confidence }}
  merge_risk:
    description: "'low', 'medium', or 'high'."
    value: ${{ steps.publish.outputs.merge_risk }}
  review_event:
    description: "GitHub review event posted: APPROVE or REQUEST_CHANGES."
    value: ${{ steps.publish.outputs.review_event }}

runs:
  using: composite
  steps:
    - name: Author token
      id: author
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-pull-requests: write
        permission-issues: write
        permission-checks: read

    - name: Resolve author identity
      id: identity
      shell: bash
      env:
        APP_TOKEN: ${{ steps.author.outputs.token }}
        APP_SLUG: ${{ steps.author.outputs.app-slug }}
        FALLBACK_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -n "${APP_TOKEN}" ]; then
          echo "::add-mask::${APP_TOKEN}"
          {
            echo "author-token=${APP_TOKEN}"
            echo "author-login=${APP_SLUG}[bot]"
          } >> "${GITHUB_OUTPUT}"
        else
          echo "::add-mask::${FALLBACK_TOKEN}"
          {
            echo "author-token=${FALLBACK_TOKEN}"
            echo "author-login=github-actions[bot]"
          } >> "${GITHUB_OUTPUT}"
        fi

    - name: Resolve PR number
      id: pr
      shell: bash
      env:
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_CONFIDENCE_THRESHOLD: ${{ inputs.confidence-threshold }}
      run: |
        set -euo pipefail
        PR_NUMBER="${INPUT_PR_NUMBER:-${EVENT_PR_NUMBER}}"
        if [ -z "${PR_NUMBER}" ]; then
          echo "::error::No pr-number input and no pull_request event payload; nothing to review."
          exit 1
        fi
        echo "pr-number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
        # inputs.confidence-threshold's declared default ("90") only applies when the
        # caller omits the key entirely. Callers that unconditionally forward
        # github.event.inputs.confidence_threshold (empty outside workflow_dispatch)
        # pass an explicit empty string, which overrides the default — and
        # Number('') is 0 in JS, silently disabling the threshold. Fall back here.
        echo "confidence-threshold=${INPUT_CONFIDENCE_THRESHOLD:-90}" >> "${GITHUB_OUTPUT}"

    - name: Fork guard
      id: fork-guard
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      run: |
        set -euo pipefail
        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REPO}" ] && [ -n "${BASE_REPO}" ] && [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
          echo "::notice::skipped — fork; maintainer can workflow_dispatch"
          echo "is-fork=true" >> "${GITHUB_OUTPUT}"
        else
          echo "is-fork=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Clear stale labels on new commit
      id: stale-clear
      if: steps.fork-guard.outputs.is-fork != 'true' && github.event.action == 'synchronize'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        PASS_LABEL: ${{ inputs.pass-label }}
        FAIL_LABEL: ${{ inputs.fail-label }}
        QA_PASS_LABEL: ${{ inputs.qa-pass-label }}
        QA_FAIL_LABEL: ${{ inputs.qa-fail-label }}
      with:
        github-token: ${{ steps.identity.outputs.author-token }}
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          const labels = [
            process.env.PASS_LABEL,
            process.env.FAIL_LABEL,
            process.env.QA_PASS_LABEL,
            process.env.QA_FAIL_LABEL,
          ];

          for (const name of labels) {
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name,
              });
              core.info(`Removed stale label '${name}'.`);
            } catch (err) {
              if (err.status === 404 || err.status === 422) {
                core.info(`Label '${name}' not present; skipping.`);
              } else {
                throw err;
              }
            }
          }

    - name: Draft/closed gate
      id: pr-state
      if: steps.fork-guard.outputs.is-fork != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        STATE_JSON="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json isDraft,state,baseRefName,headRefOid)"
        IS_DRAFT="$(echo "${STATE_JSON}" | jq -r '.isDraft')"
        STATE="$(echo "${STATE_JSON}" | jq -r '.state')"
        BASE_REF="$(echo "${STATE_JSON}" | jq -r '.baseRefName')"
        HEAD_SHA="$(echo "${STATE_JSON}" | jq -r '.headRefOid')"
        {
          echo "base-ref=${BASE_REF}"
          echo "head-sha=${HEAD_SHA}"
        } >> "${GITHUB_OUTPUT}"
        if [ "${IS_DRAFT}" = "true" ] || [ "${STATE}" = "CLOSED" ] || [ "${STATE}" = "MERGED" ]; then
          echo "::notice::skipped — PR is draft or closed"
          echo "skip=true" >> "${GITHUB_OUTPUT}"
        else
          echo "skip=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Check out PR head
      id: checkout
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ steps.pr-state.outputs.head-sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Deterministic prep and model routing
      id: route
      # PR-B: the diff base, changed-file list, full-file byte sizes, symbol
      # manifest, and Conventional-Commits title check are all computed here and
      # staged to `.ai-review/manifest.json`, instead of being re-derived by the
      # model in paid turns.
      #
      # Two reasons, in order of importance:
      #   1. Correctness. The review prompt used to instruct the model to
      #      "discover the default branch yourself" and diff against it. A model
      #      deriving the base from a false premise reviews the wrong range and
      #      reports confidently on it. A staged, asserted base cannot.
      #   2. Latency. Wall-clock is linear in turns (measured: duration ~=
      #      turns * 24s over 682 jobs), so every re-derivation is pure cost.
      #
      # It also emits `.ai-review/assignments.json` — the review roster from
      # lib/roster.js: which reviewer reads which files, and under which model.
      # NOTHING CONSUMES IT YET; the review below is still one serial session.
      # It ships now, and best-effort, so the partition it asserts (bins
      # pairwise disjoint, union equal to changed_files) is exercised on real
      # diffs across every consumer before a model stage depends on it. Same
      # shadow-mode discipline the aggregation step shipped under.
      #
      # All parsing lives in lib/prep.js and lib/roster.js behind unit tests;
      # this step only runs git and hands stdout over. Nothing here is
      # model-controlled.
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        BASE_REF: ${{ steps.pr-state.outputs.base-ref }}
        SONNET: ${{ inputs.sonnet-model }}
        OPUS: ${{ inputs.opus-model }}
        # Read by lib/roster.js only, to stamp the OSH tiering onto the roster
        # with the consumer's overrides rather than hardcoded ids.
        HAIKU: ${{ inputs.haiku-model }}
        FILES_MAX: ${{ inputs.sonnet-files-threshold }}
        CHURN_MAX: ${{ inputs.sonnet-churn-threshold }}
        MANIFEST_CLI: ${{ github.action_path }}/lib/write-manifest.js
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
      run: |
        set -euo pipefail
        mkdir -p .ai-review

        # Resolve the review range once, deterministically. `git diff A...B`
        # already means "merge base of A and B", but resolving the SHA
        # explicitly puts it in the manifest and the job log, so a wrong-range
        # review becomes diagnosable after the fact instead of invisible.
        BASE_SHA="$(git merge-base "origin/${BASE_REF}" HEAD)"
        HEAD_SHA="$(git rev-parse HEAD)"
        echo "prep: range ${BASE_SHA}..${HEAD_SHA}"

        git diff --numstat "${BASE_SHA}" HEAD > .ai-review/numstat.txt
        # -U0 keeps the hunk headers (which carry the enclosing declaration)
        # without any body lines; only `diff --git` and `@@` lines are parsed.
        git diff -U0 "${BASE_SHA}" HEAD \
          | grep -E '^(diff --git|@@)' > .ai-review/diff-headers.txt || true
        # Written to a file, never a step output: a PR title is attacker-
        # influenceable text and can contain newlines, which $GITHUB_OUTPUT
        # cannot carry without a delimiter dance.
        gh pr view "${PR_NUMBER}" --repo "${REPO}" --json title \
          --jq '.title' > .ai-review/pr-title.txt

        BASE_SHA="${BASE_SHA}" HEAD_SHA="${HEAD_SHA}" node "${MANIFEST_CLI}"

        FILES="$(jq -r '.file_count' .ai-review/manifest.json)"
        CHURN="$(jq -r '.churn' .ai-review/manifest.json)"

        # Sonnet for ordinary diffs; Opus once a diff exceeds EITHER
        # threshold. 7168977 narrowed the Sonnet band from 15/400 to 3/60,
        # which routed nearly every real PR to Opus and took the review
        # stage from ~10-13 min to a 35-min median (59-min max, jobs killed
        # at callers' 60-min cap). Every consumer picked that up at once
        # because they track this action at @main.
        #
        # Widened 15/400 -> 25/800. Measured across 682 review jobs in 7
        # consumer repos: 89% of ALL traffic still routed to Opus at 15/400,
        # and Opus runs cost 3x the wall-clock (28.1 min median vs 9.2) and
        # 4x the spend ($13.22 vs $3.27) of Sonnet ones.
        #
        # This is NOT a depth concession. The approved parallel design puts
        # every coverage reviewer on Sonnet under the OSH tiering, so this
        # previews the agreed end state rather than deviating from it.
        # Still a STOPGAP: the real fix is reviewing in parallel rather than
        # in series, and BOTH thresholds are deleted when the review stage
        # fans out. Not the long-term answer.
        FILES_MAX="${FILES_MAX:-25}"
        CHURN_MAX="${CHURN_MAX:-800}"
        if [ "${FILES}" -le "${FILES_MAX}" ] && [ "${CHURN}" -le "${CHURN_MAX}" ]; then
          MODEL="${SONNET:-claude-sonnet-5}"
        else
          MODEL="${OPUS:-claude-opus-5}"
        fi
        {
          echo "files=${FILES}"
          echo "churn=${CHURN}"
          echo "model=${MODEL}"
        } >> "${GITHUB_OUTPUT}"

    - name: Resolve linked issues
      id: linked-issues
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true' && inputs.update-linked-issues == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
      run: |
        set -euo pipefail
        # Deterministically resolve every issue this PR closes — via closing
        # keywords (Closes/Fixes/Resolves #N) AND the GitHub "linked issues"
        # UI — using the PR's closingIssuesReferences graph. Writes an array
        # of {number,title,body,state,url,labels} to .ai-review/linked-issues.json
        # for the Review stage's Angle H (intent alignment). Best-effort: any
        # failure degrades to an empty array (the model falls back to the PR
        # body). NOTE: this resolver + schema is intentionally mirrored in
        # ai-qa/action.yml (post-merge issue updates) — keep the two in sync.
        mkdir -p .ai-review
        OUT=".ai-review/linked-issues.json"
        echo '[]' > "${OUT}"
        if [ -n "${PR_NUMBER}" ]; then
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          RESP="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:20){nodes{number title body state url labels(first:20){nodes{name}}}}}}}' \
            -F owner="${OWNER}" -F repo="${NAME}" -F pr="${PR_NUMBER}" 2>/dev/null || echo '')"
          if [ -n "${RESP}" ]; then
            printf '%s' "${RESP}" | jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[] | {number, title, body, state, url, labels: [.labels.nodes[].name]}]' > "${OUT}" 2>/dev/null || echo '[]' > "${OUT}"
          fi
        fi
        COUNT="$(jq 'length' "${OUT}" 2>/dev/null || echo 0)"
        echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
        echo "Resolved ${COUNT} linked issue(s) for PR #${PR_NUMBER:-?}."

    - name: Context stage (Haiku)
      id: context
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        inputs.enable-context-stage == 'true'
      # continue-on-error: context.md is a non-essential optimization — the
      # Review stage reads it only "if present" and works without it. A flaky
      # Anthropic gateway or plugin-marketplace load can hang/error this cheap
      # Haiku call (observed: is_error with num_turns:1, cost:0 after a long
      # stall); that must NOT sink the whole review. Composite-action steps
      # cannot set timeout-minutes, so graceful degradation here + the caller's
      # job-level timeout backstop is how we bound this failure mode.
      continue-on-error: true
      uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
      # This action version rejects ANTHROPIC_AUTH_TOKEN alone (anthropics/claude-code-action#1294),
      # so the bearer token also fills anthropic_api_key to pass validation, while
      # ANTHROPIC_CUSTOM_HEADERS carries the real bearer credential used on the wire.
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        API_TIMEOUT_MS: ${{ inputs.api-timeout-ms }}
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.anthropic-auth-token != '' && format('Authorization: Bearer {0}', inputs.anthropic-auth-token) || '' }}"
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key != '' && inputs.anthropic-api-key || inputs.anthropic-auth-token }}
        # Deliberately NOT steps.identity.outputs.author-token: this stage only
        # reads the local working tree and writes context.md, so it gets the
        # unprivileged fallback token rather than the App-minted
        # pull-requests/issues/checks-scoped identity used by the publishing
        # steps later in this action.
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        # Root cause of the context.md handoff failure (Task 2.4 fix round): this
        # step ran with NO --allowedTools at all, so claude-code-action's headless
        # permission model silently denied every Write and most Bash tool calls
        # (confirmed via live run 29635771162's Context-stage permission_denials_count
        # of 6, and anthropics/claude-code-action's own base-action/README.md, which
        # shows `Write` must be explicitly allowlisted — it is not a default tool).
        # Both stages run as plain composite-action steps on the same runner
        # checkout (no container isolation), so once Write is permitted here, the
        # Review stage's relative-path read of `context.md` at the repository root
        # resolves to the same file.
        claude_args: |
          --model ${{ inputs.haiku-model }}
          --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git symbolic-ref:*),Bash(git remote show:*),Bash(git merge-base:*),Bash(git log:*),Bash(git show:*)"
        prompt: |
          Read `.ai-review/manifest.json` first: a prior deterministic step
          already staged `base_sha`, `head_sha` and `changed_files`. Trust them —
          do not run `git symbolic-ref`, `git merge-base` or `git remote show` to
          rediscover the default branch or the diff base. Diff with
          `git diff <base_sha> HEAD` using the staged SHA, then read
          the full contents of every changed file. Grep the repository for callers,
          callees, and helper functions related to the changed code, so a reviewer
          has the surrounding context without re-deriving it.

          Write a concise summary to `context.md` at the repository root covering:
          - what changed, in plain language
          - which files/functions call into or are called by the changed code
          - any related helpers, shared utilities, or patterns the changed code
            reuses or should have reused

          Do NOT review the change. Do NOT judge correctness, quality, or security.
          Do NOT produce a verdict, opinion, or recommendation of any kind. Your only
          output is the factual context.md summary — a later stage does the review.

    # Same shared-path problem the review snapshot below documents: every
    # claude-code-action step writes its execution log to the one fixed path
    # "${RUNNER_TEMP}/claude-execution-output.json", so the Review stage
    # destroys the Context stage's log before the telemetry step can read it.
    # Snapshot it now, while it is still context's own output. Observation
    # only — never fails the job, never affects the verdict.
    - name: Snapshot the context stage's execution log
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        EXEC_FILE: ${{ steps.context.outputs.execution_file }}
      run: |
        set -uo pipefail
        if [ -n "${EXEC_FILE:-}" ] && [ -s "${EXEC_FILE}" ]; then
          cp "${EXEC_FILE}" "${RUNNER_TEMP}/ai-review-exec-context-snapshot.json" || true
        fi
        exit 0

    - name: Verify context.md handoff
      id: context-verify
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        inputs.enable-context-stage == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Durable regression check for the Task 2.4 fix-round finding that the
        # Context stage's Write tool calls were silently denied (see the
        # --allowedTools comment on the Context stage step above). This makes
        # the handoff's health visible in every run's plain step log instead of
        # requiring a permission_denials_count archaeology dig.
        if [ ! -s context.md ]; then
          echo "::warning::context.md is missing or empty after the Context stage ran — the Review stage will not have handoff context. Check the Context stage step's tool-permission denials."
          exit 0
        fi
        echo "context.md present: $(wc -l < context.md) lines, $(wc -c < context.md) bytes"
        echo "--- context.md preview (first 20 lines) ---"
        head -n 20 context.md

    - name: CI signal (re-review only)
      id: ci-signal
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        HEAD_SHA: ${{ steps.pr-state.outputs.head-sha }}
      run: |
        # Best-effort only — this step must never hard-fail the job, so it
        # deliberately omits `set -e`. A normal pull_request run is the
        # *first* CI job: no required check has a completed conclusion yet,
        # so a real CI signal only exists on a manual workflow_dispatch
        # re-review, after CI has already run once.
        set -uo pipefail
        SIGNAL="no_ci"
        if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
          CHECK_RUNS="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs" --jq '.check_runs' 2>/dev/null)"
          if [ -n "${CHECK_RUNS}" ] && [ "${CHECK_RUNS}" != "[]" ] && [ "${CHECK_RUNS}" != "null" ]; then
            # If any returned check-run has not yet reached "completed"
            # (queued/in_progress), the signal is inconclusive — never guess
            # a pass/fail from a partial subset of still-running checks.
            if echo "${CHECK_RUNS}" | jq -e 'any(.[]; .status != "completed")' >/dev/null 2>&1; then
              SIGNAL="no_ci"
            else
              CONCLUSIONS="$(echo "${CHECK_RUNS}" | jq '[.[] | .conclusion]')"
              if echo "${CONCLUSIONS}" | jq -e 'any(.[]; . == "timed_out")' >/dev/null 2>&1; then
                SIGNAL="timeout"
              elif echo "${CONCLUSIONS}" | jq -e 'any(.[]; . == "failure" or . == "cancelled" or . == "action_required")' >/dev/null 2>&1; then
                SIGNAL="fail"
              elif echo "${CONCLUSIONS}" | jq -e 'all(.[]; . == "success" or . == "neutral" or . == "skipped")' >/dev/null 2>&1; then
                SIGNAL="pass"
              fi
            fi
          fi
        fi
        echo "signal=${SIGNAL}" >> "${GITHUB_OUTPUT}"

    - name: Review stage (Sonnet/Opus)
      id: review
      # continue-on-error: claude-code-action intermittently finishes the
      # session successfully but without emitting structured_output and then
      # exits 1 (upstream flakiness). Don't crash the job — the retry step
      # below re-attempts, and Publish degrades gracefully if both miss.
      #
      # --max-turns 200 (in claude_args below) was intended as a mechanical
      # backstop for rubric.md's Angle C bound. DO NOT TRUST IT AS A CEILING:
      # a measured run (EdulyCom/eduly 31294407787) reported num_turns 208
      # under this cap with subtype "success", and grepping the eight
      # highest-turn execution logs found zero error_max_turns exits. Whatever
      # num_turns counts, it is not the same quantity --max-turns budgets, so
      # this flag has never been observed to terminate a run. Wall-clock is
      # bounded in practice only by the caller's job timeout-minutes.
      #
      # THE ~27.5-MINUTE STALL IS STILL UNSOLVED. Four runs have hung on their
      # FIRST turn and returned num_turns 1, $0, zero tool calls, is_error
      # true, after 1647262 / 1666947 / 1666947 / 1656307 ms — a 1.2% spread
      # across different repos and days, i.e. a fixed ceiling, not variable
      # slowness. Two fixes were tried against it and BOTH were falsified by
      # measurement; do not re-add either without new evidence:
      #
      #   --fallback-model   A fallback triggers on an overloaded RESPONSE.
      #                      Here the gateway never answers, so nothing fires.
      #                      It was live during run 31317613715 and the stall
      #                      happened anyway.
      #   API_TIMEOUT_MS     Run 31356469199 stalled for 1656307 ms WITH this
      #                      set to 180000. A 3-minute per-request timeout
      #                      cannot produce a 27.6-minute stall, so the
      #                      ceiling lives somewhere this does not reach.
      #
      # Three of the four stalls hit the Context stage, which is why
      # `enable-context-stage` exists: removing the stage is the only measure
      # so far shown to avoid the failure, as opposed to bounding it.
      # The cause is upstream of this action — investigate the gateway.
      continue-on-error: true
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
      # Same anthropics/claude-code-action#1294 workaround as the Context stage above:
      # this action version rejects ANTHROPIC_AUTH_TOKEN alone, so the bearer token also
      # fills anthropic_api_key to pass validation, while ANTHROPIC_CUSTOM_HEADERS carries
      # the real bearer credential on the wire.
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        API_TIMEOUT_MS: ${{ inputs.api-timeout-ms }}
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.anthropic-auth-token != '' && format('Authorization: Bearer {0}', inputs.anthropic-auth-token) || '' }}"
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key != '' && inputs.anthropic-api-key || inputs.anthropic-auth-token }}
        # Deliberately NOT steps.identity.outputs.author-token, for the same
        # least-privilege reason as the Context stage: this step only reads the
        # repo, calls the Anthropic API, and returns structured output — it
        # never calls the GitHub API to post anything. The App-minted identity
        # is reserved for the deterministic Publish review step below.
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        plugins: superpowers@superpowers-marketplace
        plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
        claude_args: |
          --model ${{ steps.route.outputs.model }}
          --max-turns 200
          --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git symbolic-ref:*),Bash(git merge-base:*),Bash(git remote show:*),Bash(git log:*),Bash(git show:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(find:*),Bash(wc:*)"
          --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","confidence","merge_risk","intent","counts","review_event","comment_markdown"],"properties":{"verdict":{"type":"string","enum":["pass","fail"]},"confidence":{"type":"integer","minimum":0,"maximum":100},"merge_risk":{"type":"string","enum":["low","med","high"]},"intent":{"type":"string","enum":["aligned","partial","deviated","skipped"]},"counts":{"type":"object","additionalProperties":false,"required":["p0","p1","p2","p3"],"properties":{"p0":{"type":"integer","minimum":0},"p1":{"type":"integer","minimum":0},"p2":{"type":"integer","minimum":0},"p3":{"type":"integer","minimum":0}}},"review_event":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"comment_markdown":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","file","line","severity","summary","failure_scenario","reason","evidence","confidence"],"properties":{"id":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer","minimum":0},"severity":{"type":"string","enum":["P0","P1","P2","P3"]},"summary":{"type":"string"},"failure_scenario":{"type":"string"},"reason":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"integer","enum":[0,25,50,75,100]},"severity_confirmed":{"type":"string","enum":["P0","P1","P2","P3"]}}}},"files_reviewed":{"type":"array","items":{"type":"string"}},"tests_failing":{"type":"boolean"},"coverage_below_threshold_on_critical_paths":{"type":"boolean"},"no_tests_for_changed_logic":{"type":"boolean"},"test_execution":{"type":"string","enum":["passed","failed","skipped","not_run"]},"verification_evidence":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["claim","command","result"],"properties":{"claim":{"type":"string"},"command":{"type":"string"},"result":{"type":"string"}}}},"checklist":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["text","status"],"properties":{"text":{"type":"string"},"status":{"type":"string","enum":["verified","failed","unverifiable"]},"evidence":{"type":"string"}}}}}}'
        prompt: |
          You are performing an automated code review. Attempt to load the
          live `/requesting-code-review` and `/verification-before-completion`
          skills if the superpowers plugin installed successfully; if either
          is unavailable, proceed without it — do not fail or block on a
          missing plugin. Apply `/verification-before-completion` throughout:
          treat NO pass/verified claim as valid without fresh evidence — the
          command you ran and its actual output/exit code. If you assert a
          check passed, you must have run it and read the result this session.

          Read `${{ github.action_path }}/rubric.md`. This is the
          authoritative review methodology: an 8-angle scan (intent alignment
          first, then line-by-line diff, removed-behavior audit, cross-file
          tracing, reuse, simplification, efficiency, altitude), a severity
          scale (P0-P3), and a full review checklist. Follow it.

          The PR number is available in the `PR_NUMBER` environment variable.
          Run `gh pr view "$PR_NUMBER" --json title,body,url,number` to read
          the PR's stated goal. A deterministic earlier step has already
          resolved every issue this PR closes (via closing keywords AND
          GitHub's linked-issue graph) into `.ai-review/linked-issues.json`
          at the repository root — read that file. For each linked issue it
          lists, treat the issue's title/body/acceptance-criteria as the
          PRIMARY intent contract for the rubric's Angle H (Intent
          alignment); `gh issue view <n> --json title,body,state,labels` is
          available if you need more detail. Establish this stated goal
          BEFORE analyzing the diff, per the rubric's Angle H methodology
          (frame-setting must happen before code analysis, not after). If
          `.ai-review/linked-issues.json` is absent or empty, fall back to
          the PR title/body as the intent source.

          Read `context.md` at the repository root (written by an earlier
          context-gathering stage) for a summary of what changed and its
          callers/callees/related helpers.

          Read `.ai-review/manifest.json` FIRST. A prior deterministic step
          already resolved the review range and staged the facts you would
          otherwise re-derive: `base_sha` and `head_sha` (the exact range),
          `changed_files` (the authoritative list), `symbol_manifest`
          (declarations touched by the diff), plus `title_ok`,
          `has_test_change` and `no_tests_for_changed_logic`.

          TRUST THOSE VALUES. Do NOT run `git symbolic-ref`, `git merge-base`,
          `git remote show`, or `gh pr view` to work out the default branch,
          the diff base, or the changed-file list — they are already settled,
          and re-deriving them costs turns and risks reviewing the wrong range.
          Diff with `git diff <base_sha> HEAD` using the staged SHA.

          Read the COMPLETE contents of every file in `changed_files` with
          `Read` — never sample, truncate, or reason from the diff hunks alone.
          There is no size cap on changed files; large files are why this diff
          was routed to the stronger model. `changed_files` is the coverage
          contract: every entry gets read in full. For callers/callees outside
          the diff (Angle C), start from `symbol_manifest` and follow the
          rubric's risk-based bound instead of reading every call site in
          full — that angle has no natural stopping point and is the one place
          exhaustiveness is not the goal.

          Perform the full 8-angle scan from the rubric against the diff.
          Classify every confirmed or plausible finding into P0/P1/P2/P3 per
          the rubric's severity definitions, and count them.

          Do NOT run the project's tests, and do NOT probe for a toolchain
          or package manager. Set `test_execution: "skipped"` and move on.
          You have no shell access to any test runner — the allowlist above
          grants none — so an attempt can only waste turns on a gate that
          blocks merges. The caller's own CI lanes run the tests downstream
          of this gate and are the authoritative signal.

          Also assess test quality per the rubric's Testing section: are
          there tests for the changed logic (`no_tests_for_changed_logic`),
          is coverage on critical paths below target
          (`coverage_below_threshold_on_critical_paths`), and are any tests
          failing (`tests_failing`)? Set `tests_failing: true` if
          `test_execution` is `failed`. Report these as booleans; omit any
          you cannot assess rather than guessing. Per the rubric's exemption:
          if this diff is Docs/Config-only per §12's test requirement matrix
          (CI/workflow YAML, composite action wiring, markdown, prompt text,
          or other config with no unit-testable logic — nothing a test could
          exercise), report `no_tests_for_changed_logic: false` — that row
          requires no tests, so none missing is not a defect.

          Evaluate the PR description's checklist. If the PR body (or a
          linked issue) contains `- [ ]`/`- [x]` checklist items, return a
          `checklist` array: one entry per item with its `text` copied
          verbatim (without the `- [ ]`/`- [x]` prefix), a `status` of
          `verified` (you confirmed it is satisfied — cite how in
          `evidence`), `failed` (you confirmed it is NOT satisfied), or
          `unverifiable` (cannot be checked from code/tests, e.g. a manual
          or post-merge step). Only mark `verified` with real evidence per
          `/verification-before-completion`. A later deterministic step uses
          this to tick verified boxes in the PR body; do not edit the PR body
          yourself. Per the rubric, checklist status is a P2 reminder at
          most — do not fail the review solely on incomplete checklist items.

          Write a complete review as `comment_markdown`: findings grouped by
          severity (P0 Blockers, P1 Should Fix, P2 Nice-to-Have, P3 Nits —
          state "_None._" for empty sections), and strengths. Do not include
          a leading verdict token, a confidence/merge-risk line, or any HTML
          marker comment in `comment_markdown` — the caller deterministically
          recomputes the verdict and prepends its own banner separately.

          Populate the optional `findings` and `files_reviewed` fields of the
          structured output as well. `findings` is one entry per finding you
          report, with your own confidence 0/25/50/75/100 and, where you would
          reclassify it, `severity_confirmed`. `files_reviewed` lists every file
          you read in full — it is cross-checked against the staged manifest, so
          a short list reads as incomplete coverage. A later non-gating step
          aggregates these deterministically and compares the result against
          your own `counts`; they do not affect this run's verdict.

          Return your full assessment via the required structured output
          schema. `counts` must be accurate — a later deterministic step
          recomputes the actual pass/fail decision from `counts` alone and
          does not trust your `verdict` field; report it anyway as your own
          best assessment.

    # claude-code-action always writes its execution log to the fixed path
    # "${RUNNER_TEMP}/claude-execution-output.json" (no per-invocation unique
    # component — verified against the pinned action's source). Every
    # claude-code-action step below (repair, retry) writes to that SAME file,
    # so review's log — the expensive analysis Salvage exists to rescue —
    # would otherwise be overwritten before Salvage ever runs. Snapshot it now,
    # while it's still review's own output. Best-effort: never fails the job.
    - name: Snapshot the review stage's execution log
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        EXEC_FILE: ${{ steps.review.outputs.execution_file }}
      run: |
        set -uo pipefail
        if [ -n "${EXEC_FILE:-}" ] && [ -s "${EXEC_FILE}" ]; then
          cp "${EXEC_FILE}" "${RUNNER_TEMP}/ai-review-exec-review-snapshot.json" || true
        fi
        exit 0

    # Retry blast-radius gate. The retry below re-runs the ENTIRE review at
    # --max-turns 200 — it is not a cheap re-emit. After a long first attempt
    # it cannot finish inside any caller's timeout-minutes, so it only burns
    # tokens until the job is killed: review-stage durations up to 79.5 min
    # were measured, and 32 of 682 jobs died on the caller's clock.
    #
    # Composite-action steps cannot express elapsed time in an `if:`, so
    # compute it here from the snapshot taken immediately above and expose a
    # boolean. Extraction mirrors lib/metrics.js exactly: last `result` entry
    # wins, and its duration_ms is the stage duration. Best-effort — any
    # parse failure leaves retry-ok=true, so this can only ever suppress a
    # retry that is provably too late, never block one on missing data.
    - name: Gate the review retry on elapsed review time
      id: retry_budget
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        # 15 min. A retry starting later than this cannot complete within the
        # 25-min timeout docs/consumer-integration.md recommends.
        RETRY_BUDGET_MS: "900000"
      run: |
        set -uo pipefail
        SNAPSHOT="${RUNNER_TEMP}/ai-review-exec-review-snapshot.json"
        RETRY_OK=true
        DURATION_MS=0
        if [ -s "${SNAPSHOT}" ]; then
          DURATION_MS="$(jq -r '[.[] | select(.type == "result")] | last | .duration_ms // 0' \
            "${SNAPSHOT}" 2>/dev/null || echo 0)"
        fi
        case "${DURATION_MS}" in
          ''|*[!0-9]*) DURATION_MS=0 ;;
        esac
        if [ "${DURATION_MS}" -ge "${RETRY_BUDGET_MS}" ]; then
          RETRY_OK=false
          echo "::warning::Review stage ran ${DURATION_MS}ms (>= ${RETRY_BUDGET_MS}ms budget); skipping the full-review retry, which could not finish inside the caller's timeout."
        fi
        {
          echo "retry-ok=${RETRY_OK}"
          echo "review-duration-ms=${DURATION_MS}"
        } >> "${GITHUB_OUTPUT}"
        exit 0

    # Cheap structured-output repair. The first attempt frequently completes a
    # full review (observed: 33 turns, $3.76, 5.5 min) and then ends without
    # emitting structured_output — claude-code-action reports subtype "success"
    # with is_error true. Resuming that same session and asking only for the
    # JSON recovers the work already paid for, instead of re-reviewing from
    # scratch. Best-effort: restricted to Read only (this step must not
    # re-read the repo or use any other tool — it only re-emits output it
    # already composed), and the full retry below still runs if this misses.
    - name: Review stage — structured-output repair
      id: review_repair
      continue-on-error: true
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        steps.review.outputs.structured_output == '' &&
        steps.review.outputs.session_id != ''
      uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        API_TIMEOUT_MS: ${{ inputs.api-timeout-ms }}
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.anthropic-auth-token != '' && format('Authorization: Bearer {0}', inputs.anthropic-auth-token) || '' }}"
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key != '' && inputs.anthropic-api-key || inputs.anthropic-auth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        claude_args: |
          --resume ${{ steps.review.outputs.session_id }}
          --model ${{ steps.route.outputs.model }}
          --allowedTools "Read"
          --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","confidence","merge_risk","intent","counts","review_event","comment_markdown"],"properties":{"verdict":{"type":"string","enum":["pass","fail"]},"confidence":{"type":"integer","minimum":0,"maximum":100},"merge_risk":{"type":"string","enum":["low","med","high"]},"intent":{"type":"string","enum":["aligned","partial","deviated","skipped"]},"counts":{"type":"object","additionalProperties":false,"required":["p0","p1","p2","p3"],"properties":{"p0":{"type":"integer","minimum":0},"p1":{"type":"integer","minimum":0},"p2":{"type":"integer","minimum":0},"p3":{"type":"integer","minimum":0}}},"review_event":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"comment_markdown":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","file","line","severity","summary","failure_scenario","reason","evidence","confidence"],"properties":{"id":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer","minimum":0},"severity":{"type":"string","enum":["P0","P1","P2","P3"]},"summary":{"type":"string"},"failure_scenario":{"type":"string"},"reason":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"integer","enum":[0,25,50,75,100]},"severity_confirmed":{"type":"string","enum":["P0","P1","P2","P3"]}}}},"files_reviewed":{"type":"array","items":{"type":"string"}},"tests_failing":{"type":"boolean"},"coverage_below_threshold_on_critical_paths":{"type":"boolean"},"no_tests_for_changed_logic":{"type":"boolean"},"test_execution":{"type":"string","enum":["passed","failed","skipped","not_run"]},"verification_evidence":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["claim","command","result"],"properties":{"claim":{"type":"string"},"command":{"type":"string"},"result":{"type":"string"}}}},"checklist":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["text","status"],"properties":{"text":{"type":"string"},"status":{"type":"string","enum":["verified","failed","unverifiable"]},"evidence":{"type":"string"}}}}}}'
        prompt: |
          Your previous turn in this session finished the review but ended
          without emitting the required structured output.

          Do NOT re-analyze the diff, re-read files, or revise your findings.
          Emit the structured output NOW, using the schema, populated from the
          analysis you already completed in this session. `counts` must match
          the findings you already wrote up, and `comment_markdown` must be the
          review body you already composed (findings grouped P0-P3 with
          "_None._" for empty sections, plus strengths; no leading verdict
          token, confidence line, or HTML marker).

          Populate the optional `findings` and `files_reviewed` fields too, from
          the analysis you already completed — one `findings` entry per finding
          you reported with your own confidence 0/25/50/75/100, and every file
          you read in full in `files_reviewed`. This is transcription of work
          already done, not re-analysis.

          Emitting the structured output is your only remaining task.

    # Snapshot for the same shared-path reason as the two above. Repair's log
    # only survives at the shared path when the retry does NOT run; on the
    # double-failure path the retry overwrites it, and its cost would silently
    # vanish from the telemetry totals. Observation only.
    - name: Snapshot the repair stage's execution log
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        EXEC_FILE: ${{ steps.review_repair.outputs.execution_file }}
      run: |
        set -uo pipefail
        if [ -n "${EXEC_FILE:-}" ] && [ -s "${EXEC_FILE}" ]; then
          cp "${EXEC_FILE}" "${RUNNER_TEMP}/ai-review-exec-repair-snapshot.json" || true
        fi
        exit 0

    # The full retry previously fired ~11s after the first attempt ended and
    # was observed returning in 143ms with num_turns 1 and $0.00 cost — it
    # never reached the model. Give a transient upstream/rate-limit condition
    # time to clear before spending another full review.
    # This step's `if:` must be kept identical to the retry step's `if:`
    # below (the "Review stage (Sonnet/Opus) — retry" step) — they gate the
    # same condition, and if they drift the retry could fire without its
    # back-off delay, reintroducing the "143ms, $0.00, never reached the
    # model" bug this step exists to prevent.
    - name: Back off before the review retry
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        (steps.review.outcome == 'failure' || steps.review.outputs.structured_output == '') &&
        steps.review_repair.outputs.structured_output == '' &&
        steps.retry_budget.outputs.retry-ok != 'false'
      shell: bash
      run: sleep 45

    # Retry of the Review stage — runs only if the first attempt failed or
    # returned no structured_output (the intermittent claude-code-action miss).
    # Same model/tools/schema/credentials; a condensed prompt that re-runs the
    # full review and stresses that emitting structured output is mandatory.
    # Keep the model/tools/schema in sync with the Review stage step above.
    # This step's `if:` must also be kept identical to the "Back off before
    # the review retry" step's `if:` above, so the retry never fires without
    # first paying the 45s back-off delay.
    - name: Review stage (Sonnet/Opus) — retry
      id: review_retry
      continue-on-error: true
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        (steps.review.outcome == 'failure' || steps.review.outputs.structured_output == '') &&
        steps.review_repair.outputs.structured_output == '' &&
        steps.retry_budget.outputs.retry-ok != 'false'
      uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        API_TIMEOUT_MS: ${{ inputs.api-timeout-ms }}
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.anthropic-auth-token != '' && format('Authorization: Bearer {0}', inputs.anthropic-auth-token) || '' }}"
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key != '' && inputs.anthropic-api-key || inputs.anthropic-auth-token }}
        github_token: ${{ inputs.github-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        plugins: superpowers@superpowers-marketplace
        plugin_marketplaces: https://github.com/obra/superpowers-marketplace.git
        claude_args: |
          --model ${{ steps.route.outputs.model }}
          --max-turns 200
          --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git symbolic-ref:*),Bash(git merge-base:*),Bash(git remote show:*),Bash(git log:*),Bash(git show:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(find:*),Bash(wc:*)"
          --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","confidence","merge_risk","intent","counts","review_event","comment_markdown"],"properties":{"verdict":{"type":"string","enum":["pass","fail"]},"confidence":{"type":"integer","minimum":0,"maximum":100},"merge_risk":{"type":"string","enum":["low","med","high"]},"intent":{"type":"string","enum":["aligned","partial","deviated","skipped"]},"counts":{"type":"object","additionalProperties":false,"required":["p0","p1","p2","p3"],"properties":{"p0":{"type":"integer","minimum":0},"p1":{"type":"integer","minimum":0},"p2":{"type":"integer","minimum":0},"p3":{"type":"integer","minimum":0}}},"review_event":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"comment_markdown":{"type":"string"},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["id","file","line","severity","summary","failure_scenario","reason","evidence","confidence"],"properties":{"id":{"type":"string"},"file":{"type":"string"},"line":{"type":"integer","minimum":0},"severity":{"type":"string","enum":["P0","P1","P2","P3"]},"summary":{"type":"string"},"failure_scenario":{"type":"string"},"reason":{"type":"string"},"evidence":{"type":"string"},"confidence":{"type":"integer","enum":[0,25,50,75,100]},"severity_confirmed":{"type":"string","enum":["P0","P1","P2","P3"]}}}},"files_reviewed":{"type":"array","items":{"type":"string"}},"tests_failing":{"type":"boolean"},"coverage_below_threshold_on_critical_paths":{"type":"boolean"},"no_tests_for_changed_logic":{"type":"boolean"},"test_execution":{"type":"string","enum":["passed","failed","skipped","not_run"]},"verification_evidence":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["claim","command","result"],"properties":{"claim":{"type":"string"},"command":{"type":"string"},"result":{"type":"string"}}}},"checklist":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["text","status"],"properties":{"text":{"type":"string"},"status":{"type":"string","enum":["verified","failed","unverifiable"]},"evidence":{"type":"string"}}}}}}'
        prompt: |
          This is a RETRY of an automated code review whose previous attempt
          ended without returning the required structured output. Emitting the
          structured output as your FINAL action is mandatory this time.

          Populate the optional `findings` and `files_reviewed` fields of the
          structured output as well. `findings` is one entry per finding you
          report, with your own confidence 0/25/50/75/100 and, where you would
          reclassify it, `severity_confirmed`. `files_reviewed` lists every file
          you read in full — it is cross-checked against the staged manifest, so
          a short list reads as incomplete coverage. A later non-gating step
          aggregates these deterministically and compares the result against
          your own `counts`; they do not affect this run's verdict.

          Read `${{ github.action_path }}/rubric.md` (the authoritative 8-angle
          scan + P0-P3 severities + checklist) and `context.md` at the repo root
          if present. The PR number is in the `PR_NUMBER` environment variable;
          the PR head is already checked out. Read `.ai-review/manifest.json`
          for the staged `base_sha`/`head_sha`/`changed_files` and trust them
          rather than re-deriving the range; diff with
          `git diff <base_sha> HEAD`. Run
          `gh pr view "$PR_NUMBER" --json title,body,url,number` for the PR
          description only. Read
          `.ai-review/linked-issues.json` (repo root) if present and use each
          linked issue's acceptance criteria as the intent contract for Angle
          H. Attempt to load `/verification-before-completion` and
          `/requesting-code-review` (best-effort). Read complete file contents,
          never just the diff hunks. Do NOT run tests or probe for a
          toolchain — set `test_execution: "skipped"` (you have no shell
          access to a test runner). You MAY populate the optional
          `checklist` and `verification_evidence` fields; omit them if you
          cannot assess them.

          Perform the full review per the rubric, then write `comment_markdown`
          (findings grouped by severity P0-P3 with "_None._" for empty sections,
          plus strengths; no leading verdict token / confidence line / HTML
          marker — the caller prepends its own banner). `counts` must be
          accurate; a deterministic step recomputes the pass/fail decision.

          Return your assessment via the required structured output schema. Do
          NOT end your turn without emitting the structured output.

    # When every attempt missed the structured output, the model's final prose
    # is still in claude-code-action's execution log — a completed review that
    # would otherwise be discarded (observed: 33 turns / $3.76 thrown away).
    # Extract it so the inconclusive review carries something a human can act
    # on. Best-effort throughout: never fails the job, and an empty result just
    # means the inconclusive notice stays as-is.
    - name: Salvage unstructured review output
      id: salvage
      if: >-
        steps.fork-guard.outputs.is-fork != 'true' &&
        steps.pr-state.outputs.skip != 'true' &&
        steps.review.outputs.structured_output == '' &&
        steps.review_repair.outputs.structured_output == '' &&
        steps.review_retry.outputs.structured_output == ''
      shell: bash
      env:
        # A snapshot, not steps.review.outputs.execution_file directly: by
        # this point in the job that shared path has been overwritten by
        # review_repair and/or review_retry (see the snapshot step above).
        REVIEW_EXEC_FILE: ${{ runner.temp }}/ai-review-exec-review-snapshot.json
        # No snapshot needed here: review_retry is the last claude-code-action
        # invocation before this step runs, and nothing in between rewrites
        # the shared execution-log path.
        RETRY_EXEC_FILE: ${{ steps.review_retry.outputs.execution_file }}
      run: |
        # Best-effort only — must never hard-fail the job, so no `set -e`.
        set -uo pipefail
        mkdir -p .ai-review
        OUT=".ai-review/salvaged.md"
        : > "${OUT}"
        for f in "${RETRY_EXEC_FILE:-}" "${REVIEW_EXEC_FILE:-}"; do
          [ -n "${f}" ] && [ -s "${f}" ] || continue
          # Preferred shape: a stream of events, assistant messages carrying
          # content blocks. Fall back to a recursive scan for any text block.
          jq -r '[.[]? | select(.type == "assistant") | .message.content[]? | select(.type == "text") | .text] | last // empty' \
            "${f}" > "${OUT}" 2>/dev/null || : > "${OUT}"
          if [ ! -s "${OUT}" ]; then
            jq -r '[.. | objects | select(.type? == "text") | .text?] | map(select(. != null)) | last // empty' \
              "${f}" > "${OUT}" 2>/dev/null || : > "${OUT}"
          fi
          [ -s "${OUT}" ] && break
        done
        # GitHub caps a review body at 65536 characters; leave room for the
        # notice wrapper around it.
        if [ -s "${OUT}" ]; then
          head -c 50000 "${OUT}" > "${OUT}.trunc" && mv "${OUT}.trunc" "${OUT}"
          echo "Salvaged $(wc -c < "${OUT}") bytes of unstructured model output."
        else
          echo "No unstructured model output could be salvaged."
        fi
        exit 0

    - name: Refresh author token
      id: author-refresh
      # The Review stage above can run 30-60+ minutes on a large diff (Opus,
      # no size cap on file reads — see rubric.md). The Author token minted
      # at job start is a GitHub App installation token with a fixed ~1-hour
      # TTL that create-github-app-token cannot extend; reusing it here has
      # cost a fully-computed review, discarded on a 401 "Bad credentials"
      # from the Reset/Publish steps below once that hour elapsed. Mint a
      # fresh one right before they run instead.
      # continue-on-error: this call itself can transiently fail (5xx, rate
      # limit) — after an hour of paid Opus review, a hard failure here would
      # reproduce the exact bug this step exists to prevent, just via a new
      # trigger. identity-refresh below falls back to the original app token
      # rather than failing the job.
      continue-on-error: true
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true' && inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-pull-requests: write
        permission-issues: write

    - name: Resolve fresh author token
      id: identity-refresh
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      shell: bash
      env:
        FRESH_APP_TOKEN: ${{ steps.author-refresh.outputs.token }}
        # Fallback tier 2: the original job-start App token. Same bot
        # identity as AUTHOR_LOGIN below (unlike FALLBACK_TOKEN), so a mint
        # failure here doesn't post under a different identity than Reset
        # dismisses — that would orphan a stale review that permanently
        # blocks merge. Fine on a sub-hour run; on an hour-plus run this
        # falls through to the same 401 the original bug hit — no worse
        # than today.
        ORIGINAL_APP_TOKEN: ${{ steps.author.outputs.token }}
        FALLBACK_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -n "${FRESH_APP_TOKEN}" ]; then
          echo "::add-mask::${FRESH_APP_TOKEN}"
          echo "author-token=${FRESH_APP_TOKEN}" >> "${GITHUB_OUTPUT}"
        elif [ -n "${ORIGINAL_APP_TOKEN}" ]; then
          echo "::add-mask::${ORIGINAL_APP_TOKEN}"
          echo "author-token=${ORIGINAL_APP_TOKEN}" >> "${GITHUB_OUTPUT}"
        else
          echo "::add-mask::${FALLBACK_TOKEN}"
          echo "author-token=${FALLBACK_TOKEN}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Reset prior review and labels
      id: reset
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        AUTHOR_LOGIN: ${{ steps.identity.outputs.author-login }}
        PASS_LABEL: ${{ inputs.pass-label }}
        FAIL_LABEL: ${{ inputs.fail-label }}
        QA_PASS_LABEL: ${{ inputs.qa-pass-label }}
        QA_FAIL_LABEL: ${{ inputs.qa-fail-label }}
      with:
        github-token: ${{ steps.identity-refresh.outputs.author-token }}
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          const authorLogin = process.env.AUTHOR_LOGIN;

          const { data: reviews } = await github.rest.pulls.listReviews({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
          });

          // dismissReview only accepts APPROVED or CHANGES_REQUESTED reviews
          // (a COMMENTED review throws a 422) — filter before calling it, and
          // still wrap the call defensively in case of a race.
          const dismissible = reviews.filter(
            (review) =>
              review.user?.login === authorLogin &&
              (review.state === "APPROVED" || review.state === "CHANGES_REQUESTED"),
          );

          for (const review of dismissible) {
            try {
              await github.rest.pulls.dismissReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                review_id: review.id,
                message: "Superseded by a new ai-review run.",
              });
              core.info(`Dismissed prior review #${review.id} by '${authorLogin}'.`);
            } catch (err) {
              if (err.status === 404 || err.status === 422) {
                core.info(`Review #${review.id} could not be dismissed; skipping.`);
              } else {
                throw err;
              }
            }
          }

          // Hide (collapse as OUTDATED) every prior ai-review review by this
          // bot so stale reviews don't pile up when a fresh one is posted.
          // Uses the GraphQL minimizeComment mutation — PullRequestReview
          // implements Minimizable. Marker-scoped (`<!-- ai-review -->`), so
          // human reviews and other bots' reviews are never touched; non-fatal
          // on error (already minimized, or the token lacks minimize perms).
          const staleReviews = reviews.filter(
            (review) =>
              review.user?.login === authorLogin &&
              typeof review.body === "string" &&
              review.body.includes("<!-- ai-review -->") &&
              review.node_id,
          );

          for (const review of staleReviews) {
            try {
              await github.graphql(
                `mutation ($id: ID!) {
                  minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                    minimizedComment { isMinimized }
                  }
                }`,
                { id: review.node_id },
              );
              core.info(`Minimized prior ai-review review #${review.id} as outdated.`);
            } catch (err) {
              core.info(`Could not minimize review #${review.id}: ${err.message}`);
            }
          }

          const labels = [
            process.env.PASS_LABEL,
            process.env.FAIL_LABEL,
            process.env.QA_PASS_LABEL,
            process.env.QA_FAIL_LABEL,
          ];

          for (const name of labels) {
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name,
              });
              core.info(`Removed label '${name}'.`);
            } catch (err) {
              if (err.status === 404 || err.status === 422) {
                core.info(`Label '${name}' not present; skipping.`);
              } else {
                throw err;
              }
            }
          }

    # Derive the findings artifacts from the schema-validated structured
    # output, rather than asking the model to write them itself.
    #
    # Two reasons, both learned the hard way on this branch:
    #   1. Enforcement. --json-schema constrains the shape at the point of
    #      generation. A prose "also write these two files" instruction has
    #      nothing behind it — on run 31360398002 the instruction had landed on
    #      a Read-only step and no file was ever written on any path.
    #   2. Blast radius. Emitting the files from the model needs `Write` on a
    #      session that ingests the PR diff, PR body and linked-issue bodies,
    #      while Publish later require()s JS from github.action_path in-process
    #      with a write-scoped App token. Deriving here removes the write
    #      primitive instead of fencing it — and fencing it is not simple:
    #      Claude Code accepts a Write(path) permission rule and never consults
    #      it (only Edit(path)/Read(path) are checked), so the obvious scoping
    #      would look right in review and enforce nothing.
    - name: Derive findings artifacts
      id: derive
      continue-on-error: true
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        DERIVE_PATH: ${{ github.action_path }}/lib/derive-findings.js
        MODEL: ${{ steps.route.outputs.model }}
        REVIEW_JSON: >-
          ${{ steps.review_retry.outputs.structured_output != '' && steps.review_retry.outputs.structured_output
          || (steps.review_repair.outputs.structured_output != '' && steps.review_repair.outputs.structured_output
          || steps.review.outputs.structured_output) }}
      with:
        script: |
          const fs = require("fs");
          const { deriveArtifacts } = require(process.env.DERIVE_PATH);

          let review = null;
          try { review = JSON.parse(process.env.REVIEW_JSON || "null"); } catch { /* handled below */ }
          if (!review) { core.info("derive: no structured output to derive from"); return; }

          let assignedFiles;
          try {
            assignedFiles = JSON.parse(fs.readFileSync(".ai-review/manifest.json", "utf8")).changed_files;
          } catch {
            // Leave undefined. deriveArtifacts emits an EMPTY assigned_files
            // rather than substituting the model's own files_reviewed — that
            // would compare a model claim against another copy of itself, and
            // files_reviewed is allowed to range outside the diff, which the
            // partition check forbids for an assignment. Empty makes
            // aggregation fail closed with a named path instead. In practice the
            // shadow step below reads the same manifest and reports
            // `missing: manifest.json`, so it never reaches aggregate() anyway.
          }

          const out = deriveArtifacts(review, {
            role: "review-serial",
            assignedFiles,
            model: process.env.MODEL,
          });
          if (!out) {
            core.info("derive: structured output has no findings/files_reviewed block — nothing to write");
            return;
          }

          fs.mkdirSync(".ai-review/findings", { recursive: true });
          fs.writeFileSync(".ai-review/findings/review-serial.json", JSON.stringify(out.findings, null, 2));
          fs.writeFileSync(".ai-review/scores.json", JSON.stringify(out.scores, null, 2));
          core.info(`derive: wrote ${out.findings.findings.length} findings and ${out.scores.scores.length} scores`);

    # Shadow aggregation — OBSERVATION ONLY, gates nothing.
    #
    # PR-C's plan is to replace structured_output with findings files on disk
    # and delete the repair/back-off/retry/salvage chain. That is the first
    # change in this migration that can wrongly BLOCK a developer's PR, and it
    # lands on 7 consumer repos at once with no staging ring, so it is not
    # something to ship on a design argument alone.
    #
    # This step runs the new deterministic aggregation next to the live path
    # and records whether the two agree. It reads the files the Derive step
    # above produces from the schema-validated structured output (the model
    # holds no Write grant — see that step's comment), runs lib/aggregate.js, feeds the result through the
    # SAME lib/recompute.js the real verdict uses, and compares. Any divergence
    # is a warning in the log and a row in the job summary.
    #
    # Deliberately non-gating: `continue-on-error`, no outputs consumed by any
    # later step, and Publish below is untouched. Deleting --json-schema and the
    # recovery chain waits until this has agreed on real PRs — the evidence this
    # step exists to collect.
    - name: Shadow aggregation (non-gating)
      id: shadow
      continue-on-error: true
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        AGGREGATE_PATH: ${{ github.action_path }}/lib/aggregate.js
        RECOMPUTE_PATH: ${{ github.action_path }}/lib/recompute.js
        CONFIDENCE_THRESHOLD: ${{ steps.pr.outputs.confidence-threshold }}
        CI_SIGNAL: ${{ steps.ci-signal.outputs.signal }}
        REVIEW_JSON: >-
          ${{ steps.review_retry.outputs.structured_output != '' && steps.review_retry.outputs.structured_output
          || (steps.review_repair.outputs.structured_output != '' && steps.review_repair.outputs.structured_output
          || steps.review.outputs.structured_output) }}
      with:
        script: |
          const fs = require("fs");
          const { aggregate } = require(process.env.AGGREGATE_PATH);
          const { recompute } = require(process.env.RECOMPUTE_PATH);

          const readJson = (p) => {
            try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; }
          };

          const manifest = readJson(".ai-review/manifest.json");
          const findings = readJson(".ai-review/findings/review-serial.json");
          const scores = readJson(".ai-review/scores.json");

          const missing = [];
          if (!manifest) missing.push("manifest.json");
          if (!findings) missing.push("findings/review-serial.json");
          if (!scores) missing.push("scores.json");

          const opts = {
            confidenceThreshold: Number(process.env.CONFIDENCE_THRESHOLD),
            ciSignal: process.env.CI_SIGNAL || "no_ci",
          };

          let live = null;
          try {
            const parsed = JSON.parse(process.env.REVIEW_JSON || "null");
            if (parsed) live = recompute(parsed, opts);
          } catch { /* live path already handles its own failures */ }

          let shadow = null;
          let gateResult = null;
          let shadowStatus = missing.length ? `missing: ${missing.join(", ")}` : null;
          if (!missing.length) {
            // Spec §8 row 13: aggregation throwing must be a recorded outcome,
            // not a silent hole. continue-on-error would otherwise keep the job
            // green and produce no data point at all.
            try {
              const gate = aggregate({
                manifest,
                roster: ["review-serial"],
                findings: { "review-serial": findings },
                scores,
              });
              gateResult = gate;
              shadowStatus = gate.status === "ok" ? "ok" : `inconclusive:${gate.reason}`;
              if (gate.status === "ok") shadow = recompute(gate.review, opts);
            } catch (err) {
              shadowStatus = `aggregator-error: ${err && err.message}`;
            }
          }

          const cell = (v) => (v === null || v === undefined ? "—" : String(v));
          const agree = live && shadow
            && live.verdict === shadow.verdict
            && JSON.stringify(live.counts) === JSON.stringify(shadow.counts);

          const rows = [
            ["verdict", cell(live && live.verdict), cell(shadow && shadow.verdict)],
            ["confidence", cell(live && live.confidence), cell(shadow && shadow.confidence)],
            ["merge risk", cell(live && live.mergeRisk), cell(shadow && shadow.mergeRisk)],
            ["counts", cell(live && JSON.stringify(live.counts)), cell(shadow && JSON.stringify(shadow.counts))],
          ];

          core.info(`ai-review-shadow ${JSON.stringify({
            status: shadowStatus,
            agree: Boolean(agree),
            liveVerdict: live ? live.verdict : null,
            shadowVerdict: shadow ? shadow.verdict : null,
            liveCounts: live ? live.counts : null,
            shadowCounts: shadow ? shadow.counts : null,
          })}`);

          // Log WHY findings were filtered. Without this a count divergence is
          // visible but not diagnosable, which defeats the point of running the
          // comparison at all — the first real divergence (a P2 present live,
          // absent in shadow) could not be explained from the log.
          if (gateResult && gateResult.dropped.length > 0) {
            core.info(`ai-review-shadow-dropped ${JSON.stringify(
              gateResult.dropped.map((d) => ({
                id: d.id, severity: d.severity, confidence: d.confidence,
                why: d.dropped_because,
              })),
            )}`);
          }

          await core.summary
            .addHeading("Shadow aggregation (non-gating)", 3)
            .addRaw(`Shadow status: \`${shadowStatus}\` — agreement: **${agree ? "YES" : "NO"}**\n\n`)
            .addTable([
              [{ data: "field", header: true }, { data: "live (structured_output)", header: true }, { data: "shadow (findings files)", header: true }],
              ...rows.map((r) => r.map((c) => ({ data: c }))),
            ])
            .write();


          if (live && shadow && !agree) {
            core.warning(`Shadow aggregation DIVERGED from the live verdict: live=${live.verdict} shadow=${shadow.verdict}. Investigate before PR-C deletes structured_output.`);
          }

    - name: Publish review
      id: publish
      if: steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        PR_NUMBER: ${{ steps.pr.outputs.pr-number }}
        PASS_LABEL: ${{ inputs.pass-label }}
        FAIL_LABEL: ${{ inputs.fail-label }}
        CONFIDENCE_THRESHOLD: ${{ steps.pr.outputs.confidence-threshold }}
        CI_SIGNAL: ${{ steps.ci-signal.outputs.signal }}
        UPDATE_PR_BODY: ${{ inputs.update-pr-body }}
        REVIEW_JSON: >-
          ${{ steps.review_retry.outputs.structured_output != '' && steps.review_retry.outputs.structured_output
          || (steps.review_repair.outputs.structured_output != '' && steps.review_repair.outputs.structured_output
          || steps.review.outputs.structured_output) }}
        RECOMPUTE_PATH: ${{ github.action_path }}/lib/recompute.js
        PUBLISH_LIB_PATH: ${{ github.action_path }}/lib/publish.js
      with:
        github-token: ${{ steps.identity-refresh.outputs.author-token }}
        script: |
          const fs = require("fs");
          const { recompute } = require(process.env.RECOMPUTE_PATH);
          const {
            stripLeadingBannerArtifacts,
            buildReviewBody,
            buildInconclusiveBody,
            tickVerifiedBoxes,
            buildStatusBlock,
            upsertStatusBlock,
          } = require(process.env.PUBLISH_LIB_PATH);

          const prNumber = Number(process.env.PR_NUMBER);
          const passLabel = process.env.PASS_LABEL;
          const failLabel = process.env.FAIL_LABEL;
          const confidenceThreshold = Number(process.env.CONFIDENCE_THRESHOLD);
          const ciSignal = process.env.CI_SIGNAL;

          let review;
          try {
            review = JSON.parse(process.env.REVIEW_JSON);
          } catch (err) {
            // Both the review stage and its retry ended without valid
            // structured output (the intermittent claude-code-action miss).
            // Degrade gracefully rather than crashing the job: post an explicit
            // "inconclusive — re-run" review, fail the gate (safe — a review
            // that didn't complete must not read as pass), and set outputs so
            // review-gate sees a non-pass verdict. A re-run usually succeeds.
            core.warning(`Review stage returned no valid structured output after retry: ${err.message}. Publishing an inconclusive result.`);
            let salvaged = "";
            try {
              salvaged = fs.readFileSync(".ai-review/salvaged.md", "utf8").trim();
            } catch (e) {
              // No salvage file (step skipped, or nothing recoverable).
            }
            const inconclusiveBody = buildInconclusiveBody(salvaged);
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: "REQUEST_CHANGES",
                body: inconclusiveBody,
              });
            } catch (e) {
              core.warning(`Could not post inconclusive review: ${e.message}`);
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [failLabel],
              });
            } catch (e) {
              if (![404, 422].includes(e.status)) core.warning(e.message);
            }
            core.setOutput("verdict", "fail");
            core.setOutput("confidence", "0");
            core.setOutput("merge_risk", "high");
            core.setOutput("review_event", "REQUEST_CHANGES");
            return;
          }

          // verification_evidence is still needed below by the PR-body status
          // block, independently of the verdict computation.
          const verificationEvidence = Array.isArray(review.verification_evidence)
            ? review.verification_evidence
            : [];

          const result = recompute(review, {
            confidenceThreshold,
            ciSignal,
          });

          const {
            verdict,
            confidence,
            gateConfidence,
            mergeRisk,
            reviewEvent,
            blockers,
            counts,
            intentDeviated,
          } = result;

          core.info(
            `Gate: verdict=${verdict} confidence=${confidence} ` +
              `gateConfidence=${gateConfidence} threshold=${confidenceThreshold} ` +
              `p0=${counts.p0} p1=${counts.p1} p2=${counts.p2} p3=${counts.p3} ` +
              `test_execution=${review.test_execution || "(unset)"} ` +
              `ci_signal=${ciSignal}`
          );
          if (blockers.length) {
            core.info(`Blocking conditions: ${blockers.join("; ")}`);
          }

          const commentBody = stripLeadingBannerArtifacts(review.comment_markdown);
          const body = buildReviewBody({
            verdict,
            confidence,
            mergeRisk,
            counts,
            intentDeviated,
            modelVerdict: review.verdict,
            blockers,
            commentBody,
          });

          await github.rest.pulls.createReview({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            event: reviewEvent,
            body,
          });

          const winnerLabel = verdict === "pass" ? passLabel : failLabel;
          const loserLabel = verdict === "pass" ? failLabel : passLabel;

          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            labels: [winnerLabel],
          });

          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: loserLabel,
            });
          } catch (err) {
            if (err.status === 404 || err.status === 422) {
              core.info(`Label '${loserLabel}' not present; skipping.`);
            } else {
              throw err;
            }
          }

          // --- PR-body checklist verification (feature: update PR body) ------
          // Reflect verified checklist items back into the PR description: tick
          // boxes the model VERIFIED (with evidence) in place, and maintain a
          // managed <!-- ai-review-status --> block with per-item status +
          // evidence. Never unticks a human-checked box; never fails the job on
          // error. Gated by the update-pr-body input. The PR body is re-fetched
          // immediately before writing to minimize races with human edits.
          if (
            process.env.UPDATE_PR_BODY === "true" &&
            Array.isArray(review.checklist) &&
            review.checklist.length > 0
          ) {
            try {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const originalBody = prData.body || "";

              const { newBody: tickedBody, ticks } = tickVerifiedBoxes(originalBody, review.checklist);
              const block = buildStatusBlock({ checklist: review.checklist, verificationEvidence, verdict });
              const newBody = upsertStatusBlock(tickedBody, block);

              if (newBody !== originalBody) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: newBody,
                });
                core.info(
                  `Updated PR body (ticked ${ticks} checkbox(es), refreshed status block).`
                );
              } else {
                core.info("PR body already current; no change.");
              }
            } catch (err) {
              core.warning(`Could not update PR body: ${err.message}`);
            }
          }

          core.setOutput("verdict", verdict);
          core.setOutput("confidence", String(confidence));
          core.setOutput("merge_risk", mergeRisk);
          core.setOutput("review_event", reviewEvent);

    # Per-stage turns / cost / duration, rendered to the job summary. Pure
    # observation: runs after the verdict is published, never fails the job,
    # and touches nothing the gate depends on.
    #
    # Why this exists: the Review stage was measured at 56m04s of a 59m job
    # (138 turns, $31.01) while the repair/retry/salvage chain contributed
    # zero — but that took an archaeology dig through raw runner logs to
    # establish, and two of the numbers derived that way were wrong. This
    # step is where every later phase gate in the parallel-review migration
    # gets its numbers from.
    - name: Pipeline telemetry
      id: telemetry
      if: always() && steps.fork-guard.outputs.is-fork != 'true' && steps.pr-state.outputs.skip != 'true'
      continue-on-error: true
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        METRICS_PATH: ${{ github.action_path }}/lib/metrics.js
        # Snapshots, not the live outputs: claude-code-action writes every
        # stage's log to the same fixed path, so only the last one survives.
        CONTEXT_LOG: ${{ runner.temp }}/ai-review-exec-context-snapshot.json
        REVIEW_LOG: ${{ runner.temp }}/ai-review-exec-review-snapshot.json
        REPAIR_LOG: ${{ runner.temp }}/ai-review-exec-repair-snapshot.json
        RETRY_LOG: ${{ steps.review_retry.outputs.execution_file }}
      with:
        script: |
          const fs = require("fs");
          const { collectMetrics, renderSummary } = require(process.env.METRICS_PATH);

          const read = (p) => {
            try {
              return JSON.parse(fs.readFileSync(p, "utf8"));
            } catch {
              return null; // absent (stage skipped) or unreadable — both are "not run"
            }
          };

          const metrics = collectMetrics([
            { name: "context", log: read(process.env.CONTEXT_LOG) },
            { name: "review", log: read(process.env.REVIEW_LOG) },
            { name: "review_repair", log: read(process.env.REPAIR_LOG) },
            { name: "review_retry", log: read(process.env.RETRY_LOG) },
          ]);

          await core.summary.addRaw(renderSummary(metrics)).write();

          // Also in the plain log, so a run's numbers survive summary retention
          // and can be scraped for the baseline table.
          core.info(`ai-review-metrics ${JSON.stringify(metrics.totals)}`);

          // Say it out loud. The first five stalls were each diagnosed by
          // digging through raw runner logs after the fact; a warning here
          // means the run diagnoses itself. Observation only — the stage is
          // already continue-on-error and Publish already fails closed.
          const stalled = metrics.totals.stalledStages || [];
          if (stalled.length > 0) {
            core.warning(
              `Stage(s) ${stalled.join(", ")} stalled: hung on the first turn and returned no work ` +
              `(1 turn, $0, zero tool calls, >15 min). This is the gateway stall tracked in issue #43, ` +
              `not a code-quality result — re-run. Six prior occurrences clustered at ~27.6 min.`
            );
          }
