name: ai-qa selftest

on:
  push:
    branches: [main]

concurrency:
  group: ai-qa-selftest
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ai-qa
        uses: ./ai-qa
        with:
          app-id: ${{ vars.MTM_BOT_APP_ID }}
          private-key: ${{ secrets.MTM_BOT_APP_PRIVATE_KEY }}
          # No Anthropic credential passed → the agentic QA review no-ops and
          # the report publishes from the (always-healthy) deploy signal alone.
          # This keeps the self-test cheap and deterministic; it proves the
          # resolve-PR → health-poll → publish-comment/label pipeline end to end.
          health-url: https://raw.githubusercontent.com/EdulyCom/github-actions/main/README.md
