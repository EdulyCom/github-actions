name: zizmor

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Static analysis of GitHub Actions workflows
    runs-on: ubuntu-latest
    # Advanced Security (SARIF upload to the Security tab) is free for
    # public repos and is zizmor-action's own recommended default; these are
    # the exact permissions its README specifies for that mode.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        # advanced-security mode never fails the build (findings only go to
        # the Security tab's SARIF upload); disable it so this job is a hard
        # self-CI gate that fails directly on zizmor's own exit code.
        with:
          advanced-security: false
