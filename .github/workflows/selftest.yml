name: ai-review selftest

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: >
          Pull request number to review. Only needed for a manual run
          (e.g. a maintainer reviewing a fork PR) — a normal pull_request
          trigger resolves this automatically.
        required: false
        type: string

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      verdict: ${{ steps.r.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ai-review
        id: r
        uses: ./ai-review
        with:
          # DIAGNOSTIC (2026-08-09): run 31317613715 was killed at 30m17s with
          # the Haiku context stage holding 100% of model time — 27m27s of
          # silence, num_turns 1, zero tool calls, and no context.md written.
          # Disabling it here isolates the review stage so we can see whether
          # it completes cleanly on its own. Flip back to 'true' once the
          # stall is understood, or delete the stage outright if the parallel
          # design folds it into deterministic prep (spec §11 open question 3).
          enable-context-stage: "false"
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.MTM_BOT_APP_ID }}
          private-key: ${{ secrets.MTM_BOT_APP_PRIVATE_KEY }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}

  gated-demo:
    needs: [review]
    if: ${{ needs.review.outputs.verdict == 'pass' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Prove the verdict output gates this job
        run: echo "ai-review verdict was 'pass' — this job only runs because the gate passed."
