name: ai-review selftest

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: >
          Pull request number to review. Only needed for a manual run
          (e.g. a maintainer reviewing a fork PR) — a normal pull_request
          trigger resolves this automatically.
        required: false
        type: string

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Fan-out (Opus + Sonnet Tasks) regularly exceeds 25m wall-clock; 30m was
    # cancelling mid-review before Publish. Budget covers review + repair/retry.
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      verdict: ${{ steps.r.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercises auto-assign in its documented preferred shape — inlined as the
      # first step of the ai-review job, before the review runs — rather than as
      # a standalone workflow. That is the integration consumers actually use,
      # so it is the one worth covering.
      #
      # Ordered first deliberately: it is the cheap step, so a break surfaces in
      # seconds instead of after a 10-16 min review. It is also safe to couple
      # here because the action no-ops on a bot author, an already-assigned PR,
      # or a missing pull_request context (a workflow_dispatch re-run), and its
      # assign call is wrapped in try/catch — a failure warns rather than
      # failing the job the review depends on.
      #
      # No `if:` guard: exercising the no-op paths on workflow_dispatch is part
      # of what this covers.
      - name: Run auto-assign
        uses: ./auto-assign
        with:
          app-id: ${{ vars.MTM_BOT_APP_ID }}
          private-key: ${{ secrets.MTM_BOT_APP_PRIVATE_KEY }}

      - name: Run ai-review
        id: r
        uses: ./ai-review
        with:
          # Deliberately does NOT pass enable-context-stage: this self-test must
          # exercise the same default configuration consumers get, and the
          # context stage is on by default. A temporary "false" here during the
          # 2026-08-09 stall diagnosis meant the default path went untested
          # while it was live for every consumer — don't reintroduce that.
          pr-number: ${{ inputs.pr_number }}
          app-id: ${{ vars.MTM_BOT_APP_ID }}
          private-key: ${{ secrets.MTM_BOT_APP_PRIVATE_KEY }}
          anthropic-auth-token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic-base-url: ${{ vars.ANTHROPIC_BASE_URL }}

  gated-demo:
    needs: [review]
    if: ${{ needs.review.outputs.verdict == 'pass' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Prove the verdict output gates this job
        run: echo "ai-review verdict was 'pass' — this job only runs because the gate passed."
