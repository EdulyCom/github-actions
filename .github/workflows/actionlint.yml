name: actionlint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint workflow and action files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
        with:
          github_token: ${{ github.token }}
          # "local" reporter prints findings to the job log instead of
          # posting PR comments/checks, so this job needs no write scopes.
          # The workflow gates the PR the same way every other job in this
          # repo does: a non-zero exit fails the job, and the job's status
          # is the required context.
          reporter: local
          filter_mode: nofilter
          fail_level: error
