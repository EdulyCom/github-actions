name: ai-qa
description: >-
  Post-merge delivery hygiene at PR and issue level. After a merge (push to
  the default branch, or pull_request closed+merged) it waits for the deploy
  to become healthy, optionally runs an agentic QA review, then: on PASS
  closes linked issues and deletes the head branch; on FAIL leaves issues
  open and keeps the branch. Closed-without-merge PRs only delete the head
  branch. issues.closed reopens an issue closed before delivery. Informational
  only — no outputs, no Checks API, gates nothing.

inputs:
  app-id:
    description: >-
      GitHub App ID. Optional — with `private-key`, the report comment and
      label are authored as `<app-slug>[bot]` instead of
      `github-actions[bot]`. Cosmetic only; see ADR 0001 (b).
    required: false
  private-key:
    description: GitHub App private key, paired with `app-id`.
    required: false
  github-token:
    description: >-
      Fallback token used when `app-id`/`private-key` are not set, and the
      token the (unprivileged, read-only) QA review step always uses
      regardless of whether an App is configured.
    required: false
    default: ${{ github.token }}
  health-url:
    description: >-
      URL polled with `curl --fail` once every few seconds until it responds
      successfully or `deploy-timeout` elapses. Required — there is no sensible
      generic default for a deployed environment's health endpoint. The QA
      review also smoke-tests this URL (and routes derived from it) directly.
    required: true
  deploy-timeout:
    description: >-
      Seconds to keep polling `health-url` before giving up. Unreachable at the
      deadline counts as an unhealthy deploy (auto-P0 → fail signal).
    required: false
    default: "180"
  test-hint:
    description: >-
      Optional free-text guidance describing how to build/test this repo (e.g.
      "yarn nx run-many -t build,test --exclude=be-e2e"). Handed to the QA
      review as context — Claude MAY run it at its own discretion to confirm a
      suspected regression, but it is NOT run mechanically. The consumer is
      responsible for provisioning the toolchain (Node, etc.) in a prior step
      before this action runs.
    required: false
    default: ""
  allowed-tools:
    description: >-
      Tool allowlist passed to the QA review's `--allowedTools`. The default
      lets Claude read/grep the checked-out code, smoke-test the deploy over
      HTTP (`curl`), inspect the merged diff (`git`), and — at its discretion —
      run a JS/TS toolchain build/test. Override to widen or narrow.
    required: false
    default: >-
      Read,Grep,Glob,Bash(curl:*),Bash(git:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(wc:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(yarn:*),Bash(pnpm:*),Bash(corepack:*)
  pass-label:
    description: >-
      Label applied to the merged PR when the overall QA signal (deploy health
      and the review verdict) passes.
    required: false
    default: "✓ /ai-qa"
  fail-label:
    description: >-
      Label applied to the merged PR when the overall QA signal fails.
    required: false
    default: "✗ /ai-qa"
  anthropic-api-key:
    description: >-
      Anthropic API key used by the QA review step. Optional — without a
      credential the review step quietly no-ops and the report comment is still
      published from the deploy-health signal alone. Exactly one of
      `anthropic-api-key`/`anthropic-auth-token` should be supplied when the
      review is wanted.
    required: false
  anthropic-auth-token:
    description: >-
      Bearer token for a custom Anthropic-compatible gateway, used instead of
      `anthropic-api-key`. See the `#1294` workaround comment on the QA review
      step below.
    required: false
  anthropic-base-url:
    description: >-
      Optional custom Anthropic-compatible API base URL (e.g. a corporate
      gateway). Leave unset to use Anthropic's default endpoint.
    required: false
  update-pr-body:
    description: >-
      When 'true' (default), the Publish step maintains a managed
      `<!-- ai-qa-status -->` block in the merged PR's description reflecting
      the latest QA status. Set to 'false' to leave the PR body untouched.
    required: false
    default: "true"
  update-linked-issues:
    description: >-
      When 'true' (default), after merged delivery the Publish step posts a
      sticky QA-status comment on each issue the PR links. On a PASS it
      closes the issue (this action owns "done" — turn off GitHub auto-close)
      and applies `pass-label`; on a FAIL it leaves the issue open (and
      reopens it if GitHub already auto-closed it) and applies `fail-label`.
      Set to 'false' to leave linked issues untouched.
    required: false
    default: "true"
  cleanup-head-branch:
    description: >-
      When 'true' (default), delete this PR's head branch after a delivery
      PASS, or immediately when the PR is closed without merging. Fork heads,
      the default branch, and a head still used by another open PR are never
      deleted. A merged FAIL keeps the branch. Requires `contents: write` on
      the caller job's GITHUB_TOKEN; missing permission degrades to a warning.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Author token
      id: author
      if: inputs.app-id != '' && inputs.private-key != ''
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-pull-requests: write
        permission-issues: write

    - name: Resolve author identity
      id: identity
      shell: bash
      env:
        APP_TOKEN: ${{ steps.author.outputs.token }}
        APP_SLUG: ${{ steps.author.outputs.app-slug }}
        FALLBACK_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -n "${APP_TOKEN}" ]; then
          echo "::add-mask::${APP_TOKEN}"
          {
            echo "author-token=${APP_TOKEN}"
            echo "author-login=${APP_SLUG}[bot]"
          } >> "${GITHUB_OUTPUT}"
        else
          echo "::add-mask::${FALLBACK_TOKEN}"
          {
            echo "author-token=${FALLBACK_TOKEN}"
            echo "author-login=github-actions[bot]"
          } >> "${GITHUB_OUTPUT}"
        fi

    - name: Route event
      id: route
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_IS_PR: ${{ github.event.issue.pull_request != null && 'true' || 'false' }}
        SENDER_LOGIN: ${{ github.event.sender.login }}
        STATE_REASON: ${{ github.event.issue.state_reason }}
        ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        PUSH_SHA: ${{ github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPO: ${{ github.repository }}
        CLEANUP_PATH: ${{ github.action_path }}/lib/cleanup.js
      run: |
        set -euo pipefail
        node <<'NODE'
        const fs = require("fs");
        const { resolveMode } = require(process.env.CLEANUP_PATH);
        const r = resolveMode({
          eventName: process.env.EVENT_NAME,
          eventAction: process.env.EVENT_ACTION,
          issueIsPr: process.env.ISSUE_IS_PR,
          prMerged: process.env.PR_MERGED,
        });
        const headRepo = process.env.PR_HEAD_REPO || "";
        const repo = process.env.REPO || "";
        const isCross = !!(headRepo && repo && headRepo !== repo);
        const lines = [
          `mode=${r.mode}`,
          `reason=${r.reason}`,
          `pr-number=${process.env.PR_NUMBER || ""}`,
          `merge-sha=${process.env.PR_MERGE_SHA || process.env.PUSH_SHA || ""}`,
          `head-ref=${process.env.PR_HEAD_REF || ""}`,
          `issue-number=${process.env.ISSUE_NUMBER || ""}`,
          `sender-login=${process.env.SENDER_LOGIN || ""}`,
          `state-reason=${process.env.STATE_REASON || ""}`,
          `issue-labels=${process.env.ISSUE_LABELS || ""}`,
          `default-branch=${process.env.DEFAULT_BRANCH || ""}`,
          `is-cross-repo=${isCross ? "true" : "false"}`,
        ];
        fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
        console.log(`ai-qa route: ${r.mode} (${r.reason})`);
        NODE

    - name: Resolve merged PR and merge commit
      id: merge
      if: steps.route.outputs.mode == 'merged-delivery'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        REPO: ${{ github.repository }}
        MERGE_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PR_NUMBER: ${{ steps.route.outputs.pr-number }}
        EVENT_MERGE_SHA: ${{ steps.route.outputs.merge-sha }}
      run: |
        set -uo pipefail
        PR_NUMBER=""
        RESOLVED_SHA="${MERGE_SHA}"
        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${EVENT_PR_NUMBER}" ]; then
          PR_NUMBER="${EVENT_PR_NUMBER}"
          if [ -n "${EVENT_MERGE_SHA}" ]; then
            RESOLVED_SHA="${EVENT_MERGE_SHA}"
          fi
        else
          for attempt in 1 2 3 4 5; do
            PR_JSON="$(gh api "repos/${REPO}/commits/${MERGE_SHA}/pulls" 2>/dev/null || echo '[]')"
            PR_NUMBER="$(echo "${PR_JSON}" | jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // empty')"
            if [ -n "${PR_NUMBER}" ]; then
              break
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep 3
            fi
          done
        fi
        if [ -z "${PR_NUMBER}" ]; then
          echo "::notice::ai-qa skipped — no merged pull request is associated with commit ${MERGE_SHA} after 5 attempts (a direct push to the default branch, or GitHub has not yet indexed the association)"
          echo "skip=true" >> "${GITHUB_OUTPUT}"
        else
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "pr-number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "merge-sha=${RESOLVED_SHA}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Check out merge commit
      if: steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ steps.merge.outputs.merge-sha }}
        # depth 2 so the QA review can diff the merge commit against its first
        # parent (`git diff <sha>^1 <sha>`) — the change that just merged.
        fetch-depth: 2
        persist-credentials: false

    - name: Resolve PR context and linked issues
      id: prcontext
      if: steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.merge.outputs.pr-number }}
      run: |
        set -uo pipefail
        # Stage the merged PR's metadata for the QA review + Publish steps:
        #  - .ai-qa/pr-meta.json    → {number,title,body,url} of the merged PR
        #  - .ai-qa/test-plan.md    → the PR body's "Test Plan" section, if any
        #  - .ai-qa/linked-issues.json → issues the PR closed (keywords + graph)
        # Best-effort: every failure degrades to an empty/absent artifact. This
        # resolver + JSON shape is intentionally mirrored from ai-review — keep
        # the two in sync.
        mkdir -p .ai-qa
        printf '{}' > .ai-qa/pr-meta.json
        : > .ai-qa/test-plan.md
        echo '[]' > .ai-qa/linked-issues.json
        if [ -n "${PR_NUMBER}" ]; then
          gh pr view "${PR_NUMBER}" --repo "${REPO}" --json number,title,body,url,headRefName,isCrossRepository,mergedAt,createdAt,state,baseRefName \
            > .ai-qa/pr-meta.json 2>/dev/null || printf '{}' > .ai-qa/pr-meta.json
          # Extract the "Test Plan" section: from a "# … Test Plan" heading up to
          # the next markdown heading. `#+` (not `#{1,6}`) for mawk portability.
          BODY="$(jq -r '.body // ""' .ai-qa/pr-meta.json 2>/dev/null || echo '')"
          printf '%s\n' "${BODY}" | awk '
            BEGIN { grab = 0 }
            /^[[:space:]]*#+[[:space:]]*[Tt]est[[:space:]]*[Pp]lan/ { grab = 1; next }
            grab == 1 && /^[[:space:]]*#+[[:space:]]/ { grab = 0 }
            grab == 1 { print }
          ' > .ai-qa/test-plan.md
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          RESP="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:20){nodes{number title body state url labels(first:20){nodes{name}}}}}}}' \
            -F owner="${OWNER}" -F repo="${NAME}" -F pr="${PR_NUMBER}" 2>/dev/null || echo '')"
          if [ -n "${RESP}" ]; then
            printf '%s' "${RESP}" | jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[] | {number, title, body, state, url, labels: [.labels.nodes[].name]}]' > .ai-qa/linked-issues.json 2>/dev/null || echo '[]' > .ai-qa/linked-issues.json
          fi
        fi
        TP_PRESENT=false
        [ -s .ai-qa/test-plan.md ] && TP_PRESENT=true
        ISSUE_COUNT="$(jq 'length' .ai-qa/linked-issues.json 2>/dev/null || echo 0)"
        {
          echo "test-plan-present=${TP_PRESENT}"
          echo "issue-count=${ISSUE_COUNT}"
        } >> "${GITHUB_OUTPUT}"
        echo "Test plan present: ${TP_PRESENT}; linked issues: ${ISSUE_COUNT}."

    - name: Wait for deploy health
      id: health
      if: steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true'
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        DEPLOY_TIMEOUT: ${{ inputs.deploy-timeout }}
      run: |
        set -uo pipefail
        START="$(date +%s)"
        STATUS="timeout"
        while :; do
          if curl --fail --silent --show-error --max-time 10 "${HEALTH_URL}" >/dev/null 2>&1; then
            STATUS="healthy"
            break
          fi
          NOW="$(date +%s)"
          ELAPSED="$(( NOW - START ))"
          if [ "${ELAPSED}" -ge "${DEPLOY_TIMEOUT}" ]; then
            break
          fi
          sleep 5
        done
        echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"
        if [ "${STATUS}" != "healthy" ]; then
          echo "::warning::${HEALTH_URL} did not become healthy within ${DEPLOY_TIMEOUT}s"
        fi

    # The action's own rubric.md lives under $GITHUB_ACTION_PATH (the runner's
    # _actions dir), not in the consumer checkout — copy it into the workspace
    # so the QA review can Read it with a stable relative path.
    - name: Stage QA rubric
      id: prep
      if: steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cp "${GITHUB_ACTION_PATH}/rubric.md" "${GITHUB_WORKSPACE}/.ai-qa-rubric.md"

    # Only set ANTHROPIC_BASE_URL when the caller actually supplied one —
    # setting it to an empty string in the review step's own `env:` would
    # override claude-code-action's/the Anthropic SDK's own default endpoint
    # fallback with `''` instead of leaving the variable absent.
    - name: Set Anthropic base URL (if provided)
      id: anthropic-base-url
      if: inputs.anthropic-base-url != ''
      shell: bash
      env:
        BASE_URL: ${{ inputs.anthropic-base-url }}
      run: | # zizmor: ignore[github-env] BASE_URL is this action's own anthropic-base-url input (caller-supplied static config), never attacker-influenceable event data — see ADR-0010's env-binding rule
        echo "ANTHROPIC_BASE_URL=${BASE_URL}" >> "${GITHUB_ENV}"

    # Locked model IDs (not inputs). Keep in sync with ai-review's *schema*
    # cascade: Claude → structured_output free only (no Cursor — none advertise
    # structured_output, and --json-schema reviews go inconclusive on them).
    - name: Resolve locked models
      id: models
      if: >-
        steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true' &&
        (inputs.anthropic-api-key != '' || inputs.anthropic-auth-token != '')
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "primary=claude/claude-sonnet-5"
          echo "fallback=oc/nemotron-3.5-lightning-free,oc/deepseek-v4-flash-free,auto/best-free"
        } >> "${GITHUB_OUTPUT}"

    # Workaround for anthropics/claude-code-action#1294: the action requires
    # *some* value in `anthropic_api_key` even when authenticating to a custom
    # gateway via a bearer token, so fall back to the auth token itself and
    # carry the real bearer via a custom header instead.
    - name: Post-merge QA review
      id: review
      continue-on-error: true
      if: >-
        steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true' &&
        (inputs.anthropic-api-key != '' || inputs.anthropic-auth-token != '')
      uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
      env:
        ANTHROPIC_CUSTOM_HEADERS: "${{ inputs.anthropic-auth-token != '' && format('Authorization: Bearer {0}', inputs.anthropic-auth-token) || '' }}"
      with:
        anthropic_api_key: ${{ inputs.anthropic-api-key != '' && inputs.anthropic-api-key || inputs.anthropic-auth-token }}
        github_token: ${{ inputs.github-token }}
        # --fallback-model: Claude primary → Cursor if Claude blocked → free
        # if Cursor blocked. Keep the free tail in sync with ai-review.
        # Neither entry may equal the primary or the fallback is a no-op.
        # The list is ordered and the primary is re-tried at the start of
        # each turn. Does not bound silent gateway stalls (ADR 0005).
        claude_args: |
          --model ${{ steps.models.outputs.primary }}
          --fallback-model ${{ steps.models.outputs.fallback }}
          --allowedTools "${{ inputs.allowed-tools }}"
          --json-schema '{"type":"object","additionalProperties":false,"required":["verdict","confidence","merge_risk","deploy_status","counts","summary","report_markdown"],"properties":{"verdict":{"type":"string","enum":["pass","fail"]},"confidence":{"type":"integer","minimum":0,"maximum":100},"merge_risk":{"type":"string","enum":["low","medium","high"]},"deploy_status":{"type":"string","enum":["healthy","unhealthy","unknown"]},"counts":{"type":"object","additionalProperties":false,"required":["p0","p1","p2","p3"],"properties":{"p0":{"type":"integer","minimum":0},"p1":{"type":"integer","minimum":0},"p2":{"type":"integer","minimum":0},"p3":{"type":"integer","minimum":0}}},"summary":{"type":"string"},"report_markdown":{"type":"string"},"test_plan":{"type":"object","additionalProperties":false,"required":["present"],"properties":{"present":{"type":"boolean"},"items":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["text","status"],"properties":{"text":{"type":"string"},"status":{"type":"string","enum":["passed","failed","unverifiable"]},"evidence":{"type":"string"}}}}}}}}'
        prompt: |
          You are performing a POST-MERGE QA review of a change that just merged
          to the default branch and deployed. Pre-merge CI already reviewed and
          tested the diff, so your job is to validate the MERGED + DEPLOYED
          state and catch what pre-merge review cannot: a deploy that came up
          broken, runtime regressions, and config/integration drift.

          Read the rubric at `.ai-qa-rubric.md` (in the repo root) first — it
          defines the severities, the deployment gate, the checks to run, and
          the verdict rules. Follow it exactly.

          Context for this run:
          - Merged commit: ${{ steps.merge.outputs.merge-sha }}. The change that
            merged is the first-parent diff of that commit — inspect it with
            `git show ${{ steps.merge.outputs.merge-sha }}` or
            `git diff ${{ steps.merge.outputs.merge-sha }}^1 ${{ steps.merge.outputs.merge-sha }}`.
          - Deploy health signal (already polled by CI): "${{ steps.health.outputs.status }}"
            for ${{ inputs.health-url }} (waited up to ${{ inputs.deploy-timeout }}s).
          - Build/test guidance for this repo (may be empty — run only at your
            discretion to confirm a suspected regression, never as a default):
            ${{ inputs.test-hint }}
          - Merged PR metadata: `.ai-qa/pr-meta.json` ({number,title,body,url}).
          - The PR's "Test Plan" section (may be empty): `.ai-qa/test-plan.md`.
          - Issues this PR closed: `.ai-qa/linked-issues.json` (array of
            {number,title,body,state,url,labels}) — the acceptance criteria the
            deployed change is expected to satisfy.

          Smoke-test the deployed app over HTTP with `curl` (the health URL and
          any routes the diff touches — the base URL is the health URL minus its
          path). A non-healthy deploy, or any touched route returning 5xx /
          refusing connection, is a P0.

          Evaluate the PR's test plan. Read `.ai-qa/test-plan.md`. If it is
          non-empty, execute/verify each item you can against the DEPLOYED app
          (via `curl`) and the merged code (the allowlisted build/test tools are
          available), then return a `test_plan` object: `present: true` and an
          `items` array where each entry has the item `text`, a `status` of
          `passed` (you verified it holds — cite how in `evidence`), `failed`
          (you verified it does NOT hold), or `unverifiable` (needs manual/QA
          steps you cannot perform here), plus optional `evidence`. Only mark
          `passed` with real evidence — never assert a step passed without
          actually exercising it. A failed test-plan item is at least a P2 (see
          the rubric). If `.ai-qa/test-plan.md` is empty, return
          `test_plan: { present: false }`. Also sanity-check the deployed change
          against any linked issue's acceptance criteria.

          Return your findings via the required structured-output schema:
          `verdict`, `confidence`, `merge_risk`, `deploy_status`, per-severity
          `counts`, a one-paragraph `summary`, `report_markdown` (the full
          human-readable report body, findings grouped by severity, the smoke
          tests you ran, and any commands you chose to run), and the `test_plan`
          object described above. Do not fabricate — if you could not reach an
          endpoint or run a command, say so.

    - name: Publish report
      id: publish
      if: always() && steps.route.outputs.mode == 'merged-delivery' && steps.merge.outputs.skip != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        AUTHOR_LOGIN: ${{ steps.identity.outputs.author-login }}
        PR_NUMBER: ${{ steps.merge.outputs.pr-number }}
        MERGE_SHA: ${{ steps.merge.outputs.merge-sha }}
        HEALTH_STATUS: ${{ steps.health.outputs.status }}
        HEALTH_URL: ${{ inputs.health-url }}
        DEPLOY_TIMEOUT: ${{ inputs.deploy-timeout }}
        QA_OUTPUT: ${{ steps.review.outputs.structured_output }}
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
        PASS_LABEL: ${{ inputs.pass-label }}
        FAIL_LABEL: ${{ inputs.fail-label }}
        UPDATE_PR_BODY: ${{ inputs.update-pr-body }}
        UPDATE_LINKED_ISSUES: ${{ inputs.update-linked-issues }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        REVIEW_EXEC_FILE: ${{ steps.review.outputs.execution_file }}
        REPORT_FOOTER_PATH: ${{ github.action_path }}/lib/report-footer.js
        CLEANUP_PATH: ${{ github.action_path }}/lib/cleanup.js
        CLEANUP_HEAD_BRANCH: ${{ inputs.cleanup-head-branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Same locked primary the review stage was started with (steps.models).
        # Prefer the execution-log model when present; otherwise the requested
        # primary — never a second hardcoded literal that can drift from --model.
        QA_PRIMARY_MODEL: ${{ steps.models.outputs.primary }}
      with:
        github-token: ${{ steps.identity.outputs.author-token }}
        script: |
          const fs = require('fs');
          const { formatModelFooter, modelFromExecutionLog } = require(process.env.REPORT_FOOTER_PATH);
          const { shouldDeleteHeadBranch, shouldCloseIssue } = require(process.env.CLEANUP_PATH);

          let modelUsed = '';
          try {
            const log = JSON.parse(fs.readFileSync(process.env.REVIEW_EXEC_FILE || '', 'utf8'));
            modelUsed = modelFromExecutionLog(log);
          } catch {
            // No execution log (review skipped / missing).
          }
          // Only attribute a model when we have structured QA output. Prefer the
          // log's resolved model (captures Cursor/free fallback). If the log is
          // silent, fall back to the locked primary that this run requested —
          // same shape as ai-review's resolveModelUsed({ fallback: ROUTED_MODEL }).
          if (!modelUsed && process.env.QA_OUTPUT) {
            modelUsed = process.env.QA_PRIMARY_MODEL || '';
          }

          const prNumber = Number(process.env.PR_NUMBER);
          const healthOk = process.env.HEALTH_STATUS === 'healthy';

          // Parse the QA review's structured output. Absent when no Anthropic
          // credential was configured or the review step errored out.
          let qa = null;
          try {
            const parsed = JSON.parse(process.env.QA_OUTPUT || '{}');
            if (parsed && typeof parsed === 'object') qa = parsed;
          } catch (err) {
            core.warning(`could not parse QA structured output: ${err.message}`);
          }

          const counts = { p0: 0, p1: 0, p2: 0, p3: 0 };
          let reportMd = '';
          let modelSummary = '';
          let mergeRisk = 'low';
          const qaRan = !!(qa && qa.counts);
          if (qaRan) {
            counts.p0 = Number(qa.counts.p0) || 0;
            counts.p1 = Number(qa.counts.p1) || 0;
            counts.p2 = Number(qa.counts.p2) || 0;
            counts.p3 = Number(qa.counts.p3) || 0;
            reportMd = typeof qa.report_markdown === 'string' ? qa.report_markdown : '';
            modelSummary = typeof qa.summary === 'string' ? qa.summary : '';
          }

          // Deterministic test-plan enforcement (feature: evaluate PR test plan).
          // The model returns a per-item test_plan verdict; fold any FAILED item
          // into the P2 floor so a failed acceptance check deterministically
          // fails ai-qa (P2 = fail per the rubric), independent of whether the
          // model remembered to bump counts.p2 itself. Rendered into the report
          // below so the per-item verdicts are visible, not just counted.
          const testPlan = qaRan && qa.test_plan && typeof qa.test_plan === 'object' ? qa.test_plan : null;
          const testPlanItems = testPlan && Array.isArray(testPlan.items) ? testPlan.items : [];
          const testPlanFailed = testPlanItems.filter((i) => i && i.status === 'failed').length;
          if (testPlanFailed > 0) {
            counts.p2 = Math.max(counts.p2, testPlanFailed);
          }

          // Deterministic recompute — never trust the model's own verdict.
          // A non-healthy deploy is an automatic P0 on top of the model's counts.
          const deployP0 = healthOk ? 0 : 1;
          const p0 = counts.p0 + deployP0;
          const p1 = counts.p1;
          const p2 = counts.p2;
          const overallPass = p0 === 0 && p1 === 0 && p2 === 0;
          let confidence = 100 - 30 * p0 - 15 * p1 - 10 * p2;
          confidence = Math.max(0, Math.min(100, confidence));

          // Deterministic merge-risk — mirror ai-review's derivation; never
          // trust the model's self-reported merge_risk. Post-merge, an unhealthy
          // deploy dominates, and a P2 is a fail-level severity here so it earns
          // at least medium risk.
          if (!healthOk || p0 > 0 || p1 > 2) {
            mergeRisk = 'high';
          } else if (p1 >= 1 || p2 >= 1 || confidence < 70) {
            mergeRisk = 'medium';
          } else {
            mergeRisk = 'low';
          }

          let prMeta = {};
          try {
            const parsedMeta = JSON.parse(fs.readFileSync('.ai-qa/pr-meta.json', 'utf8'));
            if (parsedMeta && typeof parsedMeta === 'object') prMeta = parsedMeta;
          } catch (err) {
            core.info(`No pr-meta file to read: ${err.message}`);
          }
          const headRef = typeof prMeta.headRefName === 'string' ? prMeta.headRefName.trim() : '';
          let otherOpenPrCount = 0;
          if (headRef && !prMeta.isCrossRepository) {
            try {
              const { data: openHeads } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${headRef}`,
                per_page: 5,
              });
              otherOpenPrCount = Array.isArray(openHeads) ? openHeads.length : 0;
            } catch (err) {
              core.warning(`Could not list open PRs for head ${headRef}: ${err.message}`);
            }
          }
          const branchDecision = shouldDeleteHeadBranch({
            cleanupEnabled: process.env.CLEANUP_HEAD_BRANCH === 'true',
            deliveryOk: overallPass,
            merged: true,
            headRef,
            defaultBranch: process.env.DEFAULT_BRANCH || '',
            isCrossRepository: !!prMeta.isCrossRepository,
            otherOpenPrCount,
          });
          core.setOutput('delete-head-branch', branchDecision.delete ? 'true' : 'false');
          core.setOutput('head-ref', headRef);
          core.info(`Head-branch cleanup: ${branchDecision.reason} (delete=${branchDecision.delete})`);

          const body = [];
          body.push('<!-- ai-qa -->');
          body.push(overallPass ? '### ✅ ai-qa: PASS' : '### ❌ ai-qa: FAIL');
          body.push('');
          body.push(`Merge commit \`${process.env.MERGE_SHA.slice(0, 12)}\``);
          body.push('');
          body.push('| Signal | Result |');
          body.push('| --- | --- |');
          body.push(`| Deploy health (\`${process.env.HEALTH_URL}\`) | ${healthOk ? '✅ healthy' : `⏱️ not healthy within ${process.env.DEPLOY_TIMEOUT}s`} |`);
          if (qaRan) {
            body.push(`| QA review | ${confidence}% confidence · merge risk ${mergeRisk} |`);
            body.push(`| Code findings | P0 ${counts.p0} · P1 ${counts.p1} · P2 ${counts.p2} · P3 ${counts.p3} |`);
            if (testPlan && testPlan.present) {
              const tpPassed = testPlanItems.filter((i) => i && i.status === 'passed').length;
              const tpUnver = testPlanItems.filter((i) => i && i.status === 'unverifiable').length;
              body.push(`| Test plan | ✅ ${tpPassed} · ❌ ${testPlanFailed} · ❔ ${tpUnver} (of ${testPlanItems.length}) |`);
            } else if (testPlan) {
              body.push('| Test plan | — none in PR |');
            }
          } else {
            body.push(`| QA review | ⚠️ did not run — reporting deploy-health signal only |`);
          }
          if (headRef) {
            body.push(
              branchDecision.delete
                ? `| Head branch | will delete \`${headRef}\` |`
                : `| Head branch | kept \`${headRef}\` (${branchDecision.reason}) |`
            );
          }

          if (modelSummary) {
            body.push('');
            body.push(modelSummary);
          }

          if (reportMd) {
            body.push('');
            body.push('<details><summary>Full QA report</summary>');
            body.push('');
            body.push(reportMd);
            body.push('');
            body.push('</details>');
          }

          if (testPlanItems.length > 0) {
            const tpIcon = (s) => (s === 'passed' ? '✅' : s === 'failed' ? '❌' : '❔');
            body.push('');
            body.push('<details><summary>Test plan verification</summary>');
            body.push('');
            for (const it of testPlanItems) {
              if (!it || !it.text) continue;
              body.push(`- ${tpIcon(it.status)} ${it.text}${it.evidence ? ` — ${it.evidence}` : ''}`);
            }
            body.push('');
            body.push('</details>');
          }

          if (qaRan && process.env.REVIEW_OUTCOME === 'failure') {
            body.push('');
            body.push('> ⚠️ The QA review step reported a non-zero outcome — the report above may be partial.');
          }

          const footer = formatModelFooter(modelUsed);
          if (footer) {
            body.push('');
            body.push(footer);
          }

          body.push('');
          body.push(`_Posted by \`${process.env.AUTHOR_LOGIN}\` · [workflow run](${process.env.RUN_URL})_`);

          const commentBody = body.join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            per_page: 100,
          });
          const existing = comments.find((c) => c.body && c.body.includes('<!-- ai-qa -->'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });
          }

          const addLabel = overallPass ? process.env.PASS_LABEL : process.env.FAIL_LABEL;
          const removeLabel = overallPass ? process.env.FAIL_LABEL : process.env.PASS_LABEL;

          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            labels: [addLabel],
          });

          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              name: removeLabel,
            });
          } catch (err) {
            if (err.status !== 404 && err.status !== 422) {
              throw err;
            }
          }

          // --- Feature: update linked issues + PR body by last QA status -----
          // Reflect the final QA verdict onto the issues this PR closed and into
          // the merged PR's description. All writes are best-effort and never
          // fail the job. Gated by update-linked-issues / update-pr-body.
          const overallStatus = overallPass ? 'PASS' : 'FAIL';
          const statusIcon = overallPass ? '✅' : '❌';

          const issueMarker = '<!-- ai-qa-issue -->';
          const issueStatusBody = [
            issueMarker,
            `${statusIcon} **ai-qa: ${overallStatus}** for merged PR #${prNumber} (\`${process.env.MERGE_SHA.slice(0, 12)}\`)`,
            '',
            modelSummary || (healthOk ? 'Post-merge QA completed.' : 'Deploy did not become healthy within the timeout.'),
            '',
            `_Deploy health: ${healthOk ? 'healthy' : 'not healthy'} · [QA run](${process.env.RUN_URL})_`,
          ].join('\n');

          let linkedIssues = [];
          try {
            const parsedIssues = JSON.parse(fs.readFileSync('.ai-qa/linked-issues.json', 'utf8'));
            if (Array.isArray(parsedIssues)) linkedIssues = parsedIssues;
          } catch (err) {
            core.info(`No linked-issues file to read: ${err.message}`);
          }

          if (process.env.UPDATE_LINKED_ISSUES === 'true' && linkedIssues.length > 0) {
            for (const issue of linkedIssues) {
              const num = Number(issue && issue.number);
              if (!num) continue;
              try {
                const iComments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                  per_page: 100,
                });
                const iExisting = iComments.find((c) => c.body && c.body.includes(issueMarker));
                if (iExisting) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: iExisting.id,
                    body: issueStatusBody,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    body: issueStatusBody,
                  });
                }

                let liveState = String(issue.state || '').toLowerCase();
                try {
                  const { data: liveIssue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                  });
                  liveState = String(liveIssue.state || '').toLowerCase();
                } catch (e) {
                  core.warning(`Could not re-fetch #${num}: ${e.message}`);
                }

                // Close on delivery PASS (this action owns "done"). On FAIL,
                // leave open — and reopen if GitHub already auto-closed it.
                const closeDecision = shouldCloseIssue({
                  deliveryOk: overallPass,
                  linkedToThisPr: true,
                });
                if (closeDecision.close && liveState !== 'closed') {
                  try {
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      state: 'closed',
                      state_reason: 'completed',
                    });
                    core.info(`Closed linked issue #${num} (${closeDecision.reason}).`);
                  } catch (e) {
                    core.warning(`Could not close #${num}: ${e.message}`);
                  }
                } else if (!overallPass && liveState === 'closed') {
                  try {
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: num,
                      state: 'open',
                    });
                    core.info(`Reopened linked issue #${num} (delivery not verified).`);
                  } catch (e) {
                    core.warning(`Could not reopen #${num}: ${e.message}`);
                  }
                }

                const iAdd = overallPass ? process.env.PASS_LABEL : process.env.FAIL_LABEL;
                const iRemove = overallPass ? process.env.FAIL_LABEL : process.env.PASS_LABEL;
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    labels: [iAdd],
                  });
                } catch (e) {
                  if (e.status !== 404 && e.status !== 422) core.warning(`label add on #${num}: ${e.message}`);
                }
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: num,
                    name: iRemove,
                  });
                } catch (e) {
                  if (e.status !== 404 && e.status !== 422) core.warning(`label remove on #${num}: ${e.message}`);
                }
              } catch (err) {
                core.warning(`Could not update linked issue #${num}: ${err.message}`);
              }
            }
          }

          if (process.env.UPDATE_PR_BODY === 'true') {
            try {
              const { data: prData } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const originalBody = prData.body || '';
              const START = '<!-- ai-qa-status -->';
              const END = '<!-- /ai-qa-status -->';
              const block = [
                START,
                `#### ${statusIcon} ai-qa: ${overallStatus}`,
                `Deploy health: ${healthOk ? 'healthy' : 'not healthy'} · findings P0 ${counts.p0} · P1 ${counts.p1} · P2 ${counts.p2} · P3 ${counts.p3}`,
                modelSummary ? `\n${modelSummary}` : '',
                `\n_Last updated by ai-qa · [QA run](${process.env.RUN_URL})_`,
                END,
              ].filter((l) => l !== '').join('\n');
              const blockRe = new RegExp(`${START}[\\s\\S]*?${END}`);
              let newBody;
              if (blockRe.test(originalBody)) {
                newBody = originalBody.replace(blockRe, block);
              } else {
                newBody = `${originalBody.replace(/\s*$/, '')}\n\n${block}\n`;
              }
              if (newBody !== originalBody) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  body: newBody,
                });
                core.info('Updated PR body ai-qa status block.');
              }
            } catch (err) {
              core.warning(`Could not update PR body: ${err.message}`);
            }
          }

    - name: Cleanup head branch
      if: always() && steps.route.outputs.mode == 'merged-delivery' && steps.publish.outputs.delete-head-branch == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        HEAD_REF: ${{ steps.publish.outputs.head-ref }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const headRef = process.env.HEAD_REF;
          if (!headRef) {
            core.info('No head ref to delete.');
            return;
          }
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });
            core.info(`Deleted head branch ${headRef}.`);
          } catch (err) {
            if (err.status === 404) {
              core.info(`Head branch ${headRef} already gone.`);
            } else {
              core.warning(`Could not delete head branch ${headRef}: ${err.message}`);
            }
          }

    - name: Cleanup unmerged head branch
      if: steps.route.outputs.mode == 'unmerged-close'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        HEAD_REF: ${{ steps.route.outputs.head-ref }}
        DEFAULT_BRANCH: ${{ steps.route.outputs.default-branch }}
        IS_CROSS_REPO: ${{ steps.route.outputs.is-cross-repo }}
        CLEANUP_HEAD_BRANCH: ${{ inputs.cleanup-head-branch }}
        CLEANUP_PATH: ${{ github.action_path }}/lib/cleanup.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { shouldDeleteHeadBranch } = require(process.env.CLEANUP_PATH);
          const headRef = process.env.HEAD_REF || '';
          let otherOpenPrCount = 0;
          if (headRef && process.env.IS_CROSS_REPO !== 'true') {
            try {
              const { data: openHeads } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.repo.owner}:${headRef}`,
                per_page: 5,
              });
              otherOpenPrCount = Array.isArray(openHeads) ? openHeads.length : 0;
            } catch (err) {
              core.warning(`Could not list open PRs for head ${headRef}: ${err.message}`);
            }
          }
          const decision = shouldDeleteHeadBranch({
            cleanupEnabled: process.env.CLEANUP_HEAD_BRANCH === 'true',
            deliveryOk: false,
            merged: false,
            headRef,
            defaultBranch: process.env.DEFAULT_BRANCH || '',
            isCrossRepository: process.env.IS_CROSS_REPO === 'true',
            otherOpenPrCount,
          });
          core.info(`Unmerged head cleanup: ${decision.reason} (delete=${decision.delete})`);
          if (!decision.delete || !headRef) return;
          try {
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });
            core.info(`Deleted unmerged head branch ${headRef}.`);
          } catch (err) {
            if (err.status === 404) {
              core.info(`Head branch ${headRef} already gone.`);
            } else {
              core.warning(`Could not delete head branch ${headRef}: ${err.message}`);
            }
          }

    - name: Reopen prematurely closed issue
      if: steps.route.outputs.mode == 'issue-closed'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        ISSUE_NUMBER: ${{ steps.route.outputs.issue-number }}
        SENDER_LOGIN: ${{ steps.route.outputs.sender-login }}
        AUTHOR_LOGIN: ${{ steps.identity.outputs.author-login }}
        STATE_REASON: ${{ steps.route.outputs.state-reason }}
        ISSUE_LABELS: ${{ steps.route.outputs.issue-labels }}
        PASS_LABEL: ${{ inputs.pass-label }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CLEANUP_PATH: ${{ github.action_path }}/lib/cleanup.js
        GH_TOKEN: ${{ steps.identity.outputs.author-token }}
        REPO: ${{ github.repository }}
      with:
        github-token: ${{ steps.identity.outputs.author-token }}
        script: |
          const { execFileSync } = require('child_process');
          const {
            shouldReopenPrematureClose,
            linkedUndeliveredPr,
          } = require(process.env.CLEANUP_PATH);

          const issueNumber = Number(process.env.ISSUE_NUMBER);
          if (!issueNumber) {
            core.info('No issue number on this event.');
            return;
          }

          const passLabel = process.env.PASS_LABEL || '';
          const labels = (process.env.ISSUE_LABELS || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
          const hasPassLabel = labels.includes(passLabel);
          const closedByThisAction =
            (process.env.SENDER_LOGIN || '') === (process.env.AUTHOR_LOGIN || '');

          let prs = [];
          try {
            const owner = process.env.REPO.split('/')[0];
            const name = process.env.REPO.split('/')[1];
            const query =
              'query($owner:String!,$repo:String!,$n:Int!){repository(owner:$owner,name:$repo){issue(number:$n){timelineItems(first:50,itemTypes:[CONNECTED_EVENT,CROSS_REFERENCED_EVENT]){nodes{__typename ... on ConnectedEvent { subject { ... on PullRequest { number state merged labels(first:20){nodes{name}} } } } ... on CrossReferencedEvent { source { ... on PullRequest { number state merged labels(first:20){nodes{name}} } } }}}}}';
            const raw = execFileSync(
              'gh',
              [
                'api',
                'graphql',
                '-f',
                `query=${query}`,
                '-F',
                `owner=${owner}`,
                '-F',
                `repo=${name}`,
                '-F',
                `n=${issueNumber}`,
              ],
              {
                encoding: 'utf8',
                env: { ...process.env, GH_TOKEN: process.env.GH_TOKEN },
              }
            );
            const parsed = JSON.parse(raw);
            const issue = (((parsed || {}).data || {}).repository || {}).issue || {};
            const nodes = ((issue.timelineItems || {}).nodes) || [];
            const seen = new Set();
            for (const n of nodes) {
              const pr = (n && (n.subject || n.source)) || null;
              if (!pr || !pr.number || seen.has(pr.number)) continue;
              seen.add(pr.number);
              prs.push({
                number: pr.number,
                merged: !!(pr.merged || pr.state === 'MERGED'),
                labels: ((pr.labels && pr.labels.nodes) || []).map((x) => x.name),
              });
            }
          } catch (err) {
            core.warning(`Could not resolve linked PRs for #${issueNumber}: ${err.message}`);
          }

          const decision = shouldReopenPrematureClose({
            closedByThisAction,
            hasPassLabel,
            stateReason: process.env.STATE_REASON || '',
            linkedUndeliveredPr: linkedUndeliveredPr(prs, passLabel),
          });
          core.info(`Issue #${issueNumber} premature-close: ${decision.reason}`);
          if (!decision.reopen) return;

          try {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'open',
            });
            const marker = '<!-- ai-qa-issue -->';
            const body = [
              marker,
              `⚠️ **ai-qa: reopened** — this issue was closed before delivery was verified (${decision.reason}).`,
              '',
              `_Turn off GitHub auto-close (Settings → General → Issues) so merge is not "done." [QA run](${process.env.RUN_URL})_`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
            core.info(`Reopened issue #${issueNumber}.`);
          } catch (err) {
            core.warning(`Could not reopen #${issueNumber}: ${err.message}`);
          }
